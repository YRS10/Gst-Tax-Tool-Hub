<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misc. Excel Work</title>
<style>
  :root { --bg:#f3f5f7; --bar:#e4e9ee; --tab:#fff; --tab-hover:#eaf3ff; --accent:#2f9bff; --text:#14212e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; background: var(--bg); }
  nav { display: flex; gap: 6px; background: var(--bar); padding: 8px 12px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #cfd6dd; }
  nav button { flex: 0 0 auto; padding: 8px 16px; border: 1px solid #cfd6dd; background: var(--tab); color: var(--text); cursor: pointer; font: inherit; font-size: .88rem; border-radius: 999px; }
  nav button:hover { background: var(--tab-hover); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  iframe.active { display: block; }
</style>
</head>
<body>
  <!--
    To update a tool: replace its file in the "tools" folder (same name) and bump the ?v= number.
    To add a tool: copy one <button> line, give it a new data-id, label and file.
  -->
  <nav id="subtabs" role="tablist">
    <button data-id="rename" data-src="rename-ledger.html?v=2">Rename Files</button>
    <button data-id="paste"  data-src="excel-paste-values.html?v=1">Excel Paste Values</button>
    <button data-id="sheet"  data-src="excel-sheet-renamer.html?v=1">Excel Sheet Renamer</button>
    <button data-id="merge"  data-src="excel-merger.html?v=1">Excel Merger</button>
  </nav>
  <main id="panes"></main>
<script>
  const tabs = [...document.querySelectorAll('#subtabs button')];
  const panes = document.getElementById('panes');
  const frames = {};
  function openTab(id) {
    const btn = tabs.find(b => b.dataset.id === id) || tabs[0];
    tabs.forEach(b => b.classList.toggle('active', b === btn));
    if (!frames[btn.dataset.id]) {
      const f = document.createElement('iframe');
      f.src = btn.dataset.src; f.title = btn.textContent;
      panes.appendChild(f); frames[btn.dataset.id] = f;
    }
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === btn.dataset.id));
  }
  tabs.forEach(b => b.addEventListener('click', () => openTab(b.dataset.id)));
  openTab(tabs[0].dataset.id);
</script>
</body>
</html>

<script type="application/json" id="doc-2b">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#f4f6f9\">\n\u003ctitle>GSTR-2B Consolidator\u003c/title>\n\u003c!--GSTLIBS:xlsx-->\n\u003c!--GSTLIBS:exceljs-->\n\u003cstyle>\n  :root{font-family:Inter,\"Segoe UI\",Arial,sans-serif;color:#182230;background:#f4f6f9;font-synthesis:none;text-rendering:optimizeLegibility}\n  *{box-sizing:border-box}\n  body{margin:0;background:#f4f6f9;color:#182230}\n  .app{max-width:1180px;margin:0 auto;padding:34px 28px 52px}\n  .topline{display:flex;align-items:center;gap:12px;margin-bottom:30px;color:#576577;font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}\n  .mark{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:#1d6b52;color:#fff;font-size:12px;font-weight:800;letter-spacing:0}\n  h1{font-size:clamp(29px,4vw,42px);letter-spacing:-.045em;line-height:1.08;margin:0;color:#14251f}\n  .intro{max-width:730px;color:#617064;line-height:1.65;margin:13px 0 25px;font-size:15px}\n  .notice{display:flex;gap:12px;align-items:flex-start;border:1px solid #dce9e2;background:#f0f7f3;border-radius:12px;padding:14px 16px;color:#345c48;font-size:13px;line-height:1.5;margin-bottom:22px}\n  .notice strong{color:#1e4834}\n  .instruction{display:flex;gap:12px;align-items:flex-start;border:1px solid #f0dfb0;border-left:4px solid #c8921b;background:#fffaec;border-radius:12px;padding:14px 16px;color:#5c4a14;font-size:13px;line-height:1.55;margin-bottom:22px}\n  .instruction strong{color:#4a3a0c}\n  .instruction .ico{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:#c8921b;color:#fff;font-weight:800;font-size:13px}\n  .panel{background:#fff;border:1px solid #e3e8e5;border-radius:16px;box-shadow:0 8px 26px #16332708}\n  .upload{padding:24px}\n  .upload h2{display:flex;align-items:center;font-size:19px;letter-spacing:-.02em;margin:0 0 8px}\n  .step-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eaf3ed;color:#1d6b52;font-weight:800;font-size:14px;margin-right:8px}\n  .step-intro{color:#617064;font-size:13px;line-height:1.55;margin:0 0 14px}\n  .flash{display:block;margin-bottom:15px;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.5;background:#f1f5f8;border:1px solid #d9e2e8;color:#405b6a}\n  .flash.error{background:#fff2ef;border-color:#f0c8bf;color:#873b2c}\n  .flash.success{background:#edf7f0;border-color:#cce4d2;color:#2c6842}\n  #dropzone{min-height:176px;border:1.5px dashed #b9ccc1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:#fbfdfb;cursor:pointer;transition:.18s}\n  #dropzone::before{content:\"\\2191\";display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#eaf3ed;color:#1d6b52;font-size:22px;margin-bottom:12px}\n  #dropzone.dragover{border-color:#1d6b52;background:#f0f7f3}\n  #dropzone p{margin:0 0 7px;color:#77847b;font-size:12px;max-width:640px;line-height:1.5}\n  #dropzone p strong{color:#253a30;font-size:15px;font-weight:700}\n  input[type=file]{display:none}\n  .btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}\n  .btnRow button{border:0;border-radius:9px;background:#1d6b52;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:11px 16px;cursor:pointer;transition:background .15s,transform .15s}\n  .btnRow button:hover{background:#15543f;transform:translateY(-1px)}\n  .btnRow button.ghost{background:#fff;color:#873b2c;border:1px solid #c9d3e0}\n  .btnRow button.ghost:hover{background:#fff2ef;transform:none}\n  #fileSummary{margin-top:14px;font-size:13px;color:#38483e;font-weight:700}\n  #fileList{margin-top:8px;font-size:13px;color:#38483e;max-height:280px;overflow-y:auto;border:1px solid #e9eeeb;border-radius:9px}\n  #fileList:empty{display:none}\n  #fileList details{border-bottom:1px solid #edf0ee}\n  #fileList details:last-child{border-bottom:none}\n  #fileList summary{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;background:#f8faf8}\n  #fileList summary .dirname{word-break:break-all}\n  #fileList summary .count{color:#87928a;font-size:12px;white-space:nowrap;margin-left:auto;padding-left:8px}\n  #fileList .fileRow{padding:4px 12px 4px 28px;color:#67756b;font-size:12px;word-break:break-all}\n  #fileList span.remove{color:#873b2c;cursor:pointer;font-weight:700}\n  button#submitBtn{margin-top:18px;width:100%;background:#1d6b52;color:#fff;border:0;padding:13px;border-radius:9px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,transform .15s}\n  button#submitBtn:hover:not(:disabled){background:#15543f;transform:translateY(-1px)}\n  button#submitBtn:disabled{background:#aab8b0;cursor:not-allowed}\n  #nonStdArea{display:none;margin-top:16px;border:1px solid #f0c8bf;background:#fff8f6;border-radius:12px;padding:14px 16px}\n  #nonStdArea h3{margin:0 0 4px;font-size:14px;color:#873b2c}\n  #nonStdArea p{margin:0 0 10px;font-size:12px;color:#7a5148;line-height:1.5}\n  #nonStdArea .tbl{max-height:260px;overflow:auto;border:1px solid #f0d9d3;border-radius:8px;background:#fff}\n  #nonStdArea table{border-collapse:collapse;width:100%;font-size:12px}\n  #nonStdArea th{position:sticky;top:0;background:#f7e6e1;text-align:left;padding:7px 10px;color:#6b3326}\n  #nonStdArea td{padding:7px 10px;border-top:1px solid #f3e4df;vertical-align:top;line-height:1.45;color:#3d2a25}\n  #nonStdArea td.f{word-break:break-all;min-width:160px}\n  #log{display:none;margin-top:16px;background:#14251f;color:#cfe8da;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;padding:12px 14px;border-radius:9px;max-height:220px;overflow-y:auto;white-space:pre-wrap}\n  #downloadArea{display:none;margin-top:16px;text-align:center}\n  #downloadArea a{display:inline-block;background:#1d6b52;color:#fff;text-decoration:none;padding:12px 22px;border-radius:9px;font-weight:700;font-size:13px}\n  #downloadArea a:hover{background:#15543f}\n  .info{padding:22px 24px;margin-top:16px}\n  .info h2{font-size:19px;letter-spacing:-.02em;margin:0 0 8px}\n  .info p{color:#617064;font-size:13px;line-height:1.65;margin:0 0 10px}\n  .info p:last-child{margin-bottom:0}\n  .dashboard-footer{color:#7b867f;font-size:12px;text-align:center;margin-top:28px;line-height:1.6}\n  @media(max-width:760px){.app{padding:23px 16px 38px}.upload,.info{padding:18px 16px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cmain class=\"app\">\n  \u003cdiv class=\"topline\">\u003cspan class=\"mark\">2B\u003c/span> GSTR-2B Consolidator\u003c/div>\n  \u003ch1>Combine your GSTR-2B files\u003cbr>into one clear workbook.\u003c/h1>\n  \u003cp class=\"intro\">Upload GSTR-2B folders (one or many GSTINs) or individual Excel files and get one consolidated, sheet-wise workbook back.\u003c/p>\n  \u003cdiv class=\"notice\">\u003cspan aria-hidden=\"true\">●\u003c/span>\u003cdiv>\u003cstrong>Private and local.\u003c/strong> Runs 100% in your browser. Your files are read on your device and never leave it.\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"instruction\" role=\"note\">\u003cspan class=\"ico\" aria-hidden=\"true\">!\u003c/span>\u003cdiv>\u003cstrong>Important instruction before uploading.\u003c/strong> Please upload the GSTR-2B Excel files exactly as downloaded from the GST portal. Do not rename, edit, re-save or alter the file contents in any way, as modified files may not be read correctly and could produce incomplete or inaccurate consolidated output.\u003c/div>\u003c/div>\n\n  \u003csection class=\"panel upload\" aria-label=\"Upload and consolidate GSTR-2B files\">\n    \u003ch2>\u003cspan class=\"step-number\">1\u003c/span>Upload and consolidate\u003c/h2>\n    \u003cp class=\"step-intro\">Add your GSTR-2B folders or files, then consolidate to download one Excel workbook.\u003c/p>\n    \u003cdiv id=\"flashArea\">\u003c/div>\n    \u003cform id=\"uploadForm\" autocomplete=\"off\">\n    \u003cdiv id=\"dropzone\">\n      \u003cp>\u003cstrong>Drag & drop one or more folders here\u003c/strong>\u003c/p>\n      \u003cp>Choose a parent folder that holds one sub-folder per GSTIN, or add each GSTIN folder one by one.\n         Sub-folders are scanned automatically; only .xlsx GSTR-2B files are picked up.\u003c/p>\n      \u003cdiv class=\"btnRow\">\n        \u003cbutton type=\"button\" id=\"addFolderBtn\">Add Folder\u003c/button>\n        \u003cbutton type=\"button\" id=\"addFilesBtn\">Add Files\u003c/button>\n        \u003cbutton type=\"button\" id=\"clearBtn\" class=\"ghost\">Clear all\u003c/button>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"folderInput\" webkitdirectory>\n      \u003cinput type=\"file\" id=\"fileInput\" accept=\".xlsx\" multiple>\n    \u003c/div>\n    \u003cdiv id=\"fileSummary\">\u003c/div>\n    \u003cdiv id=\"fileList\">\u003c/div>\n    \u003cbutton type=\"submit\" id=\"submitBtn\" disabled>Consolidate & Download\u003c/button>\n  \u003c/form>\n    \u003cdiv id=\"log\">\u003c/div>\n    \u003cdiv id=\"nonStdArea\" role=\"region\" aria-label=\"Files not in standard GSTR-2B format\">\u003c/div>\n    \u003cdiv id=\"downloadArea\">\n      \u003ca id=\"downloadLink\" href=\"#\">Download Consolidated_GSTR2B.xlsx\u003c/a>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"panel info\" aria-label=\"About this tool\">\n    \u003ch2>What you get\u003c/h2>\n    \u003cp>Consolidates 24 transaction-sheet categories (B2B, B2BA, CDNR, ISD, IMPG, etc.) from any number of files, folders and GSTINs into one workbook, plus a Value Summary and a Summary/audit-trail sheet. Each row carries its Source File (with folder path), Financial Year, Tax Period, GSTIN and Legal Name; rows are grouped GSTIN-wise, then by month.\u003c/p>\n    \u003cp>Invoices/notes amended in a later period (B2BA, B2B-CDNRA) replace their original rows, and the amended rows show the original tax period beside them. The \"Amended Inv. Comparison\" sheet lists each original invoice/note that was later amended with its original values, amended values and the difference (increase / decrease / newly reported in amendment).\u003c/p>\n    \u003cp>Nothing is uploaded anywhere. All processing happens locally in this browser tab, using JavaScript libraries loaded from a CDN. The result is generated and offered to you as a download, with no network transfer of the actual data.\u003c/p>\n  \u003c/section>\n\u003c/main>\n\n\u003cscript>\n// ============================================================================\n// Consolidation logic - ported 1:1 from the original consolidate_gstr2b.py\n// Verified against the Python script's output on matched test fixtures.\n// ============================================================================\n\nconst SHEETS_TO_CONSOLIDATE = [\n  \"B2B\", \"B2BA\",\n  \"B2B-CDNR\", \"B2B-CDNRA\",\n  \"B2B-DNR\", \"B2B-DNRA\",\n  \"ECO\", \"ECOA\",\n  \"ISD\", \"ISDA\",\n  \"IMPG\", \"IMPGA\",\n  \"IMPGSEZ\", \"IMPGSEZA\",\n  \"B2B (ITC Reversal)\", \"B2BA (ITC Reversal)\",\n  \"B2B(Rejected)\", \"B2BA(Rejected)\",\n  \"B2B-CDNR(Rejected)\", \"B2B-CDNRA(Rejected)\",\n  \"ECO(Rejected)\", \"ECOA(Rejected)\",\n  \"ISD(Rejected)\", \"ISDA(Rejected)\",\n];\n\n// Standard GSTR-2B summary sheets that are intentionally not consolidated. Any sheet that is in\n// neither this list nor SHEETS_TO_CONSOLIDATE triggers a \"possible format change\" warning.\nconst KNOWN_IGNORED_SHEETS = [\"Read me\", \"ITC Available\", \"ITC not available\", \"ITC Reversal\", \"ITC Rejected\"];\n\nconst EXTRA_COLUMNS = [\"Source File\", \"Financial Year\", \"Tax Period\", \"GSTIN\", \"Legal Name\"];\n\nconst MONTH_MAP = {\n  january: 1, february: 2, march: 3, april: 4, may: 5, june: 6,\n  july: 7, august: 8, september: 9, october: 10, november: 11, december: 12,\n  jan: 1, feb: 2, mar: 3, apr: 4, jun: 6, jul: 7,\n  aug: 8, sep: 9, oct: 10, nov: 11, dec: 12,\n};\n\nfunction pymod(a, b) { return ((a % b) + b) % b; }\n\nfunction getCellValue(ws, r, c) {\n  const cell = ws[XLSX.utils.encode_cell({ r, c })];\n  return cell ? cell.v : null;\n}\n\nfunction getReadmeInfo(wb) {\n  const info = { \"Financial Year\": \"\", \"Tax Period\": \"\", \"GSTIN\": \"\", \"Legal Name\": \"\" };\n  if (!wb.SheetNames.includes(\"Read me\")) return info;\n  const ws = wb.Sheets[\"Read me\"];\n  const labelMap = { \"Financial Year\": \"Financial Year\", \"Tax Period\": \"Tax Period\", \"GSTIN\": \"GSTIN\", \"Legal Name\": \"Legal Name\" };\n  for (let r = 0; r \u003c 14; r++) {\n    const labelVal = getCellValue(ws, r, 0);\n    if (labelVal == null) continue;\n    const label = String(labelVal).trim();\n    for (const key in labelMap) {\n      if (labelMap[key] === label) {\n        const val = getCellValue(ws, r, 2);\n        info[key] = val != null ? val : \"\";\n      }\n    }\n  }\n  return info;\n}\n\nfunction fillMergedGrid(ws, maxRow, maxCol) {\n  const grid = [];\n  for (let r = 0; r \u003c maxRow; r++) {\n    const row = [];\n    for (let c = 0; c \u003c maxCol; c++) row.push(getCellValue(ws, r, c));\n    grid.push(row);\n  }\n  const merges = ws['!merges'] || [];\n  for (const m of merges) {\n    if (m.s.r >= maxRow) continue;\n    const topVal = grid[m.s.r][m.s.c];\n    const endR = Math.min(m.e.r, maxRow - 1);\n    for (let r = m.s.r; r \u003c= endR; r++) {\n      for (let c = m.s.c; c \u003c= m.e.c; c++) grid[r][c] = topVal;\n    }\n  }\n  return grid;\n}\n\nfunction detectHeaderEndRow(ws, defaultRow = 6) {\n  let headerEnd = defaultRow;\n  const merges = ws['!merges'] || [];\n  for (const m of merges) {\n    const minRow1 = m.s.r + 1;\n    if (minRow1 >= 5) headerEnd = Math.max(headerEnd, m.e.r + 1);\n  }\n  return headerEnd;\n}\n\nfunction flattenHeaders(grid, headerStartRow, headerEndRow, maxCol) {\n  const headers = [];\n  for (let c = 0; c \u003c maxCol; c++) {\n    const parts = [];\n    for (let r = headerStartRow - 1; r \u003c headerEndRow; r++) {\n      let v = grid[r] ? grid[r][c] : null;\n      if (v == null) continue;\n      v = String(v).trim();\n      if (v && (parts.length === 0 || v !== parts[parts.length - 1])) parts.push(v);\n    }\n    headers.push(parts.length ? parts.join(\" - \") : `Column${c + 1}`);\n  }\n  return headers;\n}\n\nfunction getSheetDims(ws) {\n  const ref = ws['!ref'];\n  if (!ref) return { maxRow: 0, maxCol: 0 };\n  const range = XLSX.utils.decode_range(ref);\n  return { maxRow: range.e.r + 1, maxCol: range.e.c + 1 };\n}\n\nfunction extractSheetData(ws) {\n  const { maxRow, maxCol } = getSheetDims(ws);\n  const headerEndRow = detectHeaderEndRow(ws);\n\n  if (maxRow \u003c= headerEndRow) {\n    const grid = fillMergedGrid(ws, headerEndRow, maxCol);\n    const headers = flattenHeaders(grid, 5, headerEndRow, maxCol);\n    return { headers, dataRows: [] };\n  }\n\n  const grid = fillMergedGrid(ws, headerEndRow, maxCol);\n  const headers = flattenHeaders(grid, 5, headerEndRow, maxCol);\n\n  const dataRows = [];\n  for (let r = headerEndRow; r \u003c maxRow; r++) {\n    const rowVals = [];\n    let allBlank = true;\n    for (let c = 0; c \u003c maxCol; c++) {\n      const v = getCellValue(ws, r, c);\n      rowVals.push(v);\n      if (!(v == null || String(v).trim() === '')) allBlank = false;\n    }\n    if (allBlank) continue;\n    dataRows.push(rowVals);\n  }\n  return { headers, dataRows };\n}\n\nfunction mergeHeaders(masterHeaders, newHeaders) {\n  const indexMap = [];\n  for (const h of newHeaders) {\n    const idx = masterHeaders.indexOf(h);\n    if (idx !== -1) indexMap.push(idx);\n    else { masterHeaders.push(h); indexMap.push(masterHeaders.length - 1); }\n  }\n  return indexMap;\n}\n\nfunction classifyValueColumns(headers) {\n  const idx = { doc_value: null, taxable: null, igst: null, cgst: null, sgst: null, cess: null, rcm: null, itc_availability: null, note_type: null };\n  headers.forEach((h, i) => {\n    const hl = h.toLowerCase();\n    if (hl.includes(\"itc reduction\") || hl.includes(\"declared by taxpayer\")) return;\n    if (hl.includes(\"itc availability\")) { if (idx.itc_availability === null) idx.itc_availability = i; }\n    else if (hl.includes(\"note type\")) {\n      // amended sheets can carry an \"Original ... Note type\" and a revised one: prefer the revised\n      if (idx.note_type === null ||\n          (headers[idx.note_type].toLowerCase().includes(\"original\") && !hl.includes(\"original\"))) idx.note_type = i;\n    }\n    else if (hl.includes(\"reverse charge\")) { if (idx.rcm === null) idx.rcm = i; }\n    else if (hl.includes(\"taxable value\")) { if (idx.taxable === null) idx.taxable = i; }\n    else if (hl.includes(\"integrated tax\")) { if (idx.igst === null) idx.igst = i; }\n    else if (hl.includes(\"central tax\")) { if (idx.cgst === null) idx.cgst = i; }\n    else if (hl.includes(\"state\") && hl.includes(\"tax\")) { if (idx.sgst === null) idx.sgst = i; }\n    else if (hl.includes(\"cess\")) { if (idx.cess === null) idx.cess = i; }\n    else if (hl.includes(\"value\") && idx.doc_value === null) { idx.doc_value = i; }\n  });\n  return idx;\n}\n\nfunction toNumber(val) {\n  if (val == null || val === '') return 0.0;\n  const n = Number(val);\n  return Number.isNaN(n) ? 0.0 : n;\n}\n\nfunction isReverseChargeYes(val) {\n  return val != null && String(val).trim().toLowerCase() === 'yes';\n}\n\nfunction fiscalPeriodSortKey(row) {\n  if (row.length \u003c 3) return [0, 0];\n  const fyVal = row.length > 1 ? row[1] : null;\n  const taxPeriod = row[2];\n  if (taxPeriod == null) return [0, 0];\n\n  const s = String(taxPeriod).trim().toLowerCase();\n  let month = MONTH_MAP[s];\n  if (month === undefined) {\n    const m = s.match(/(\\d{4})[-/\\s](\\d{1,2})|([a-z]{3,9})[-/\\s]*(\\d{4})/);\n    if (m) {\n      if (m[1]) month = parseInt(m[2], 10);\n      else month = MONTH_MAP[m[3]] !== undefined ? MONTH_MAP[m[3]] : 1;\n    } else {\n      return [0, 0];\n    }\n  }\n\n  let fyYear = 0;\n  if (fyVal != null) {\n    const m2 = String(fyVal).match(/(\\d{4})/);\n    if (m2) fyYear = parseInt(m2[1], 10);\n  }\n  if (fyYear === 0) {\n    const m3 = s.match(/(\\d{4})/);\n    fyYear = m3 ? parseInt(m3[1], 10) : 2000;\n  }\n\n  const fiscalMonth = pymod(month - 4, 12) + 1;\n  return [fyYear, fiscalMonth];\n}\n\nconst MONTH_ABBR = [\"\", \"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n\n// \"Tax Period\" shown as MMM-YYYY (calendar month/year, not the fiscal month): reuses the same\n// Financial Year + Tax Period parsing as fiscalPeriodSortKey so the two always agree.\nfunction taxPeriodLabel(row) {\n  if (row.length \u003c 3 || row[2] == null) return '';\n  const fyVal = row.length > 1 ? row[1] : null;\n  const s = String(row[2]).trim().toLowerCase();\n  let month = MONTH_MAP[s];\n  if (month === undefined) {\n    const m = s.match(/(\\d{4})[-/\\s](\\d{1,2})|([a-z]{3,9})[-/\\s]*(\\d{4})/);\n    if (m) month = m[1] ? parseInt(m[2], 10) : (MONTH_MAP[m[3]] !== undefined ? MONTH_MAP[m[3]] : 1);\n    else return String(row[2]);   // unrecognised text: show it as-is rather than blank\n  }\n  let fyYear = 0;\n  if (fyVal != null) { const m2 = String(fyVal).match(/(\\d{4})/); if (m2) fyYear = parseInt(m2[1], 10); }\n  if (fyYear === 0) { const m3 = s.match(/(\\d{4})/); fyYear = m3 ? parseInt(m3[1], 10) : 0; }\n  if (!fyYear || month \u003c 1 || month > 12) return String(row[2]);\n  const calYear = month \u003c= 3 ? fyYear + 1 : fyYear;   // Jan/Feb/Mar fall in the second calendar year of the FY\n  return `${MONTH_ABBR[month]}-${calYear}`;\n}\n\n// Value Summary is built GSTIN-wise: one block per GSTIN (own header row, GSTIN shown on every\n// row), and two blank rows between blocks. Within a block the Type-of-ITC logic is unchanged.\n// Returns { rows, types } where types[i] is 'header' | 'data' | 'blank' for rows[i].\nfunction buildValueSummary(consolidated) {\n  const HEADER = [\"GSTIN\", \"Type of ITC\", \"Row Count\", \"Invoice/Note/Document Value\", \"Taxable Value\", \"Integrated Tax\", \"Central Tax\", \"State/UT Tax\", \"Cess\"];\n  const offset = EXTRA_COLUMNS.length;\n  const GSTIN_COL = EXTRA_COLUMNS.indexOf(\"GSTIN\");\n  const gstinOf = (r) => (r[GSTIN_COL] == null ? '' : String(r[GSTIN_COL]).trim());\n\n  const gstinSet = new Set();\n  for (const name of Object.keys(consolidated)) {\n    const c = consolidated[name];\n    if (c.headers == null) continue;\n    c.rows.forEach(r => gstinSet.add(gstinOf(r)));\n  }\n  // sorted by GSTIN; rows whose GSTIN could not be read (blank) go last\n  const gstins = Array.from(gstinSet).sort((a, b) => ((a === '') - (b === '')) || a.localeCompare(b));\n\n  const rows = [], types = [];\n  if (gstins.length === 0) { rows.push(HEADER.slice()); types.push('header'); }\n\n  const ZERO = () => ({ count: 0, doc_value: 0, taxable: 0, igst: 0, cgst: 0, sgst: 0, cess: 0 });\n\n  gstins.forEach((g, gi) => {\n    if (gi > 0) { rows.push([], []); types.push('blank', 'blank'); }   // two line breaks between GSTINs\n    rows.push(HEADER.slice()); types.push('header');\n    const label = g === '' ? '(GSTIN not available)' : g;\n    const gt = ZERO();   // Grand Total for this GSTIN: excludes Rejected lines, deducts Credit Note lines\n    const pushLine = (typeName, t, opts = {}) => {\n      rows.push([label, typeName, t.count, t.doc_value, t.taxable, t.igst, t.cgst, t.sgst, t.cess]);\n      types.push('data');\n      if (opts.rejected) return;\n      const sign = opts.credit ? -1 : 1;\n      gt.count += t.count;\n      for (const key of [\"doc_value\", \"taxable\", \"igst\", \"cgst\", \"sgst\", \"cess\"]) gt[key] += sign * t[key];\n    };\n\n    for (const sheetName of Object.keys(consolidated)) {\n      const content = consolidated[sheetName];\n      const headers = content.headers;\n      if (headers == null) continue;\n      const dataRows = content.rows.filter(r => gstinOf(r) === g);\n      if (dataRows.length === 0) continue;\n\n      const cols = classifyValueColumns(headers);\n      const colIndex = (key) => cols[key] != null ? offset + cols[key] : null;\n\n      const totalsFor = (subset) => {\n        const t = { count: subset.length, doc_value: 0, taxable: 0, igst: 0, cgst: 0, sgst: 0, cess: 0 };\n        for (const r of subset) {\n          for (const key of [\"doc_value\", \"taxable\", \"igst\", \"cgst\", \"sgst\", \"cess\"]) {\n            const ci = colIndex(key);\n            if (ci != null && ci \u003c r.length) t[key] += toNumber(r[ci]);\n          }\n        }\n        return t;\n      };\n\n      const rcmIdx = colIndex(\"rcm\");\n      const itcAvailIdx = colIndex(\"itc_availability\");\n      const noteTypeIdx = colIndex(\"note_type\");\n\n      const isItcNotAvailable = (r) => {\n        if (itcAvailIdx == null || itcAvailIdx >= r.length) return false;\n        const val = String(r[itcAvailIdx]).trim().toLowerCase();\n        return val === 'no' || val === 'not available' || val === 'itc not available';\n      };\n      const isDebitNote = (r) => {\n        if (noteTypeIdx == null || noteTypeIdx >= r.length) return false;\n        return String(r[noteTypeIdx]).trim().toLowerCase() === 'debit note';\n      };\n\n      let rcmRows = [], nonRcmRows;\n      if (rcmIdx != null) {\n        rcmRows = dataRows.filter(r => rcmIdx \u003c r.length && isReverseChargeYes(r[rcmIdx]));\n        nonRcmRows = dataRows.filter(r => !(rcmIdx \u003c r.length && isReverseChargeYes(r[rcmIdx])));\n      } else {\n        nonRcmRows = dataRows;\n      }\n\n      const mainRows = [], notAvailableRows = [], debitNoteRows = [];\n      for (const r of nonRcmRows) {\n        if (isItcNotAvailable(r)) notAvailableRows.push(r);\n        else if (isDebitNote(r)) debitNoteRows.push(r);\n        else mainRows.push(r);\n      }\n\n      // A sheet's main line is Credit Note only for note-bearing sheets (CDNR/CDNRA/DNR/DNRA),\n      // since debit notes there are already split off into their own \"-Debit Note\" line.\n      const isRejected = /reject/i.test(sheetName);\n      const mainIsCredit = noteTypeIdx != null;\n\n      pushLine(sheetName, totalsFor(mainRows), { rejected: isRejected, credit: mainIsCredit });\n      // \"ITC Not Available\" lines (from any sheet - B2B, B2BA, CDNR...) are excluded from the total,\n      // same as Rejected: ITC that isn't available should never count toward ITC availed.\n      if (notAvailableRows.length) pushLine(`${sheetName} ITC Not Available`, totalsFor(notAvailableRows), { rejected: true });\n      if (debitNoteRows.length) pushLine(`${sheetName}-Debit Note`, totalsFor(debitNoteRows), { rejected: isRejected });\n      if (rcmRows.length) pushLine(`${sheetName} (Reverse Charge - Yes)`, totalsFor(rcmRows), { rejected: isRejected });\n    }\n\n    rows.push([label, \"Grand Total (Credit Note deducted; Rejected & ITC Not Available ignored)\", gt.count, gt.doc_value, gt.taxable, gt.igst, gt.cgst, gt.sgst, gt.cess]);\n    types.push('grandtotal');\n  });\n  return { rows, types };\n}\n\n// ============================================================================\n// Amendment reconciliation\n// An invoice/note amended later (B2BA / B2B-CDNRA) must count ONCE - at its amended value:\n//   * the ORIGINAL row (B2B / B2B-CDNR) of the same supplier document is removed, so it is\n//     dropped from the sheet and from the Value Summary;\n//   * if the same document was amended more than once, only the latest amendment is kept;\n//   * every kept amended row gets the original Financial Year / Tax Period / Source File\n//     (shown beside its own period columns in the output).\n// A document is \"the same\" only when ALL of these match:\n//     recipient GSTIN (the GSTIN of the uploaded 2B) + supplier GSTIN + number + date\n// ============================================================================\nconst AMEND_PAIRS = [\n  { orig: \"B2B\",      amend: \"B2BA\",      label: \"invoice\", numWord: \"invoice number\", dateWord: \"invoice date\" },\n  { orig: \"B2B-CDNR\", amend: \"B2B-CDNRA\", label: \"note\",    numWord: \"note number\",    dateWord: \"note date\" },\n  { orig: \"B2B-DNR\",  amend: \"B2B-DNRA\",  label: \"note\",    numWord: \"note number\",    dateWord: \"note date\" },\n];\nconst AMEND_SHEET_NAMES = new Set(AMEND_PAIRS.map(p => p.amend));\nconst ORIG_PERIOD_COLUMNS = [\"Original Financial Year\", \"Original Tax Period\", \"Original Source File\"];\n\nfunction normStr(v) { return v == null ? '' : String(v).trim().toUpperCase(); }\n\nfunction normDate(v) {\n  if (v == null || v === '') return '';\n  const pad = (n) => String(n).padStart(2, '0');\n  if (typeof v === 'number') {                       // Excel serial date\n    try { const d = XLSX.SSF.parse_date_code(v); if (d) return `${d.y}-${pad(d.m)}-${pad(d.d)}`; } catch (e) {}\n    return String(v);\n  }\n  const s = String(v).trim();\n  let m = s.match(/^(\\d{1,2})[-\\/.](\\d{1,2})[-\\/.](\\d{4})$/);          // dd-mm-yyyy (GST portal format)\n  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;\n  m = s.match(/^(\\d{4})[-\\/.](\\d{1,2})[-\\/.](\\d{1,2})$/);              // yyyy-mm-dd\n  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;\n  m = s.match(/^(\\d{1,2})[-\\/ ]([A-Za-z]{3,9})[-\\/ ,]*(\\d{4})$/);      // 05-Apr-2025\n  if (m && MONTH_MAP[m[2].toLowerCase()]) return `${m[3]}-${pad(MONTH_MAP[m[2].toLowerCase()])}-${pad(m[1])}`;\n  return s.toUpperCase();\n}\n\nfunction reconcileAmendments(consolidated, logRows, progressCallback) {\n  const offset = EXTRA_COLUMNS.length;\n  const stats = { removed: 0, chainRemoved: 0, linked: 0, comparisons: [] };\n  const cmp = (a, b) => (a[0] - b[0]) || (a[1] - b[1]);\n  const isKnown = (k) => k[0] !== 0 || k[1] !== 0;\n  const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1);\n\n  for (const pair of AMEND_PAIRS) {\n    const O = consolidated[pair.orig], A = consolidated[pair.amend];\n    if (!O || !A || O.headers == null || A.headers == null || A.rows.length === 0) continue;\n\n    const oh = O.headers.map(h => String(h).toLowerCase());\n    const ah = A.headers.map(h => String(h).toLowerCase());\n    const oG = oh.findIndex(h => h.includes(\"gstin of supplier\"));\n    const oN = oh.findIndex(h => h.includes(pair.numWord) && !h.includes(\"original\") && !h.includes(\"revised\"));\n    const oD = oh.findIndex(h => h.includes(pair.dateWord) && !h.includes(\"original\") && !h.includes(\"revised\"));\n    const aG = ah.findIndex(h => h.includes(\"gstin of supplier\"));\n    const aN = ah.findIndex(h => h.includes(\"original\") && h.includes(\"number\"));\n    const aD = ah.findIndex(h => h.includes(\"original\") && h.includes(\"date\"));\n    if ([oG, oN, oD, aG, aN, aD].some(i => i \u003c 0)) {\n      const msg = `WARNING: could not locate the supplier GSTIN / original ${pair.label} number & date columns in ${pair.orig} / ${pair.amend} - amendments NOT reconciled for this pair`;\n      logRows.push([\"-\", pair.amend, 0, msg]);\n      progressCallback(msg);\n      continue;\n    }\n\n    const keyOf = (r, g, n, d) => {\n      const sup = normStr(r[offset + g]), num = normStr(r[offset + n]), dt = normDate(r[offset + d]);\n      if (!sup || !num || !dt) return null;\n      return `${normStr(r[3])}|${sup}|${num}|${dt}`;\n    };\n\n    const oMap = new Map();\n    for (const r of O.rows) {\n      const k = keyOf(r, oG, oN, oD);\n      if (k) { if (!oMap.has(k)) oMap.set(k, []); oMap.get(k).push(r); }\n    }\n    const aMap = new Map();\n    for (const r of A.rows) {\n      const k = keyOf(r, aG, aN, aD);\n      if (k) { if (!aMap.has(k)) aMap.set(k, []); aMap.get(k).push(r); }\n    }\n\n    const origRemove = new Set(), chainRemove = new Set();\n    const supMap = new Map();   // document key -> { rows: superseded original rows, first: earliest one }\n    for (const [k, arows] of aMap) {\n      const knownA = arows.filter(r => isKnown(fiscalPeriodSortKey(r)));\n      if (!knownA.length) continue;                       // cannot order without a tax period\n      const latest = knownA.map(r => fiscalPeriodSortKey(r)).reduce((m, x) => (cmp(x, m) > 0 ? x : m));\n\n      // amended more than once -> only the latest amendment stays\n      for (const r of knownA) if (cmp(fiscalPeriodSortKey(r), latest) \u003c 0) chainRemove.add(r);\n\n      // an original is superseded when the amendment is in the same or a later period\n      const superseded = (oMap.get(k) || []).filter(r => {\n        const pk = fiscalPeriodSortKey(r);\n        return isKnown(pk) && cmp(pk, latest) \u003c= 0;\n      });\n      if (superseded.length) {\n        const first = superseded.reduce((m, r) => (cmp(fiscalPeriodSortKey(r), fiscalPeriodSortKey(m)) \u003c 0 ? r : m));\n        const info = { fy: first[1], period: first[2], file: first[0] };\n        supMap.set(k, { rows: superseded, first });\n        for (const r of arows) r.__orig = info;\n        superseded.forEach(r => origRemove.add(r));\n      }\n    }\n\n    if (origRemove.size) O.rows = O.rows.filter(r => !origRemove.has(r));\n    if (chainRemove.size) A.rows = A.rows.filter(r => !chainRemove.has(r));\n\n    const perFile = (set) => { const m = new Map(); set.forEach(r => inc(m, r[0])); return m; };\n    perFile(origRemove).forEach((n, file) => logRows.push([file, pair.orig, -n,\n      `REMOVED: ${n} original row(s) superseded by a later amendment in ${pair.amend}`]));\n    perFile(chainRemove).forEach((n, file) => logRows.push([file, pair.amend, -n,\n      `REMOVED: ${n} row(s) superseded by a later amendment of the same ${pair.label}`]));\n\n    // ---- Amended Inv. Comparison data: original vs (latest) amended values --------------\n    {\n      const FIELDS = [\"doc_value\", \"taxable\", \"igst\", \"cgst\", \"sgst\", \"cess\"];\n      const oc = classifyValueColumns(O.headers), ac = classifyValueColumns(A.headers);\n      const sum = (rows, cols) => {\n        const t = {}; FIELDS.forEach(f => { t[f] = 0; });\n        for (const r of rows) for (const f of FIELDS) {\n          const ci = cols[f] == null ? null : offset + cols[f];\n          if (ci != null && ci \u003c r.length) t[f] += toNumber(r[ci]);\n        }\n        return t;\n      };\n      const firstMatch = (hs, fn) => hs.findIndex(fn);\n      const aNameI = firstMatch(ah, h => h.includes(\"trade/legal name\") || h.includes(\"trade name\") || h.includes(\"legal name of supplier\"));\n      const oNameI = firstMatch(oh, h => h.includes(\"trade/legal name\") || h.includes(\"trade name\") || h.includes(\"legal name of supplier\"));\n      const aRevNumI = firstMatch(ah, h => h.includes(\"revised\") && h.includes(pair.numWord));\n      const aRevDtI = firstMatch(ah, h => h.includes(\"revised\") && h.includes(pair.dateWord));\n      const aNoteTypeI = ac.note_type;\n      const cell = (r, i) => (i == null || i \u003c 0 || offset + i >= r.length || r[offset + i] == null) ? '' : r[offset + i];\n\n      // group the KEPT amended rows by document (rows without a usable key stay on their own)\n      const groups = new Map(); let seq = 0;\n      for (const r of A.rows) {\n        const k = keyOf(r, aG, aN, aD) || `__nokey_${seq++}`;\n        if (!groups.has(k)) groups.set(k, []);\n        groups.get(k).push(r);\n      }\n      for (const [k, arows] of groups) {\n        const a0 = arows[0];\n        const sup = supMap.get(k);\n        let oRows = [];\n        if (sup) {   // original = rows of the earliest superseded period (guards against duplicate uploads)\n          const fk = fiscalPeriodSortKey(sup.first);\n          oRows = sup.rows.filter(r => cmp(fiscalPeriodSortKey(r), fk) === 0);\n        }\n        const oVals = oRows.length ? sum(oRows, oc) : null;\n        const aVals = sum(arows, ac);\n        const diff = {}; FIELDS.forEach(f => { diff[f] = aVals[f] - (oVals ? oVals[f] : 0); });\n        const totTax = (v) => v.igst + v.cgst + v.sgst + v.cess;\n        let status;\n        if (!oVals) status = \"Newly reported in amendment\";\n        else if (FIELDS.every(f => Math.abs(diff[f]) \u003c 0.005)) status = \"No change\";\n        else {\n          const net = diff.taxable + totTax(diff);\n          status = net > 0.005 ? \"Increased\" : (net \u003c -0.005 ? \"Decreased\" : \"Changed (net nil)\");\n        }\n        const revNum = aRevNumI >= 0 ? cell(a0, aRevNumI) : '';\n        const revDt = aRevDtI >= 0 ? cell(a0, aRevDtI) : '';\n        stats.comparisons.push({\n          recipient: a0[3], legalName: a0[4],\n          docType: `${pair.orig} ${pair.label === \"invoice\" ? \"Invoice\" : \"Note\"}${aNoteTypeI != null && cell(a0, aNoteTypeI) ? ` (${cell(a0, aNoteTypeI)})` : ''}`,\n          supplier: cell(a0, aG), supplierName: aNameI >= 0 ? cell(a0, aNameI) : (oRows.length && oNameI >= 0 ? cell(oRows[0], oNameI) : ''),\n          origNo: cell(a0, aN), origDate: cell(a0, aD), revNo: revNum, revDate: revDt,\n          amendCount: (aMap.get(k) || arows).length,\n          status,\n          origFy: oRows.length ? oRows[0][1] : '', origPeriod: oRows.length ? oRows[0][2] : '', origFile: oRows.length ? oRows[0][0] : '',\n          amFy: a0[1], amPeriod: a0[2], amFile: a0[0],\n          oVals, aVals, diff, totTaxDiff: totTax(diff),\n          sortKey: fiscalPeriodSortKey(a0),\n        });\n      }\n    }\n\n    const linked = A.rows.filter(r => r.__orig).length;\n    stats.removed += origRemove.size; stats.chainRemoved += chainRemove.size; stats.linked += linked;\n    progressCallback(`Amendments ${pair.orig} -> ${pair.amend}: ${origRemove.size} original row(s) removed, ` +\n      `${chainRemove.size} older amendment row(s) removed, ${linked} amended row(s) linked to original period`);\n  }\n  return stats;\n}\n\nfunction reportNonStandard(list, cb) {\n  if (!list.length) return;\n  cb('');\n  cb(`FILES NOT IN STANDARD GSTR-2B (GST PORTAL) FORMAT: ${list.length}`);\n  list.forEach((x, i) => cb(`  ${i + 1}. ${x.file}  [${x.status}]  ${x.reason}`));\n  cb('');\n}\n\nasync function consolidateFiles(fileEntries, progressCallback) {\n  // Each entry: { name: \u003crelative path shown in \"Source File\">, baseName, file: \u003cFile> }\n  // (an entry may alternatively carry a ready `arrayBuffer`).\n  const IGNORED_FILE_RE = /^(~\\$|\\._|\\.ds_store$|thumbs\\.db$|desktop\\.ini$)/i;\n  const nonStandard = [];   // { file, status, reason } - files that do not match the GST portal GSTR-2B format\n  const flagFile = (name, status, reason) => nonStandard.push({ file: name, status, reason });\n\n  const files = [];\n  for (const f of fileEntries) {\n    if (IGNORED_FILE_RE.test(f.baseName || f.name)) continue;\n    if (!f.name.toLowerCase().endsWith('.xlsx')) {\n      flagFile(f.name, 'Skipped', 'Not an Excel (.xlsx) file - GSTR-2B must be the .xlsx file downloaded from the GST portal');\n      continue;\n    }\n    files.push(f);\n  }\n  files.sort((a, b) => a.name.localeCompare(b.name));\n\n  if (files.length === 0) {\n    reportNonStandard(nonStandard, progressCallback);\n    const err = new Error(\"No .xlsx files to process.\");\n    err.nonStandardFiles = nonStandard;\n    throw err;\n  }\n\n  const consolidated = {};\n  SHEETS_TO_CONSOLIDATE.forEach(name => consolidated[name] = { headers: null, rows: [] });\n\n  const logRows = [];\n  logRows.fileMeta = new Map();   // file name -> GSTIN / name / FY / period (used by the one-row-per-file Summary)\n  const gstins = new Set();\n  const seenPeriods = new Map();   // \"GSTIN|FY|Period\" -> first file that had it\n  const unknownSheets = new Map(); // unrecognised sheet name -> first file that had it\n  let processedCount = 0, skippedCount = 0, warningCount = 0;\n\n  for (let fi = 0; fi \u003c files.length; fi++) {\n    const file = files[fi];\n    progressCallback(`[${fi + 1}/${files.length}] Processing: ${file.name}`);\n    await new Promise(r => setTimeout(r, 0)); // yield to keep UI responsive\n\n    let wb;\n    try {\n      // Read lazily, one file at a time, so hundreds of files don't sit in memory together\n      const buf = file.file ? await file.file.arrayBuffer() : file.arrayBuffer;\n      wb = XLSX.read(buf, { type: 'array' });\n    } catch (e) {\n      logRows.push([file.name, \"-\", 0, `FAILED TO OPEN: ${e.message}`]);\n      flagFile(file.name, 'Skipped', `Could not be opened - file is corrupted or not a valid Excel file (${e.message})`);\n      skippedCount++;\n      progressCallback(`    FAILED TO OPEN: ${e.message}`);\n      continue;\n    }\n\n    // Folders often contain unrelated Excel files - skip anything that is not a GSTR-2B\n    const looksLike2B = wb.SheetNames.includes(\"Read me\") ||\n                        SHEETS_TO_CONSOLIDATE.some(n => wb.SheetNames.includes(n));\n    if (!looksLike2B) {\n      logRows.push([file.name, \"-\", 0, \"SKIPPED: not a GSTR-2B file (no 'Read me' / transaction sheets)\"]);\n      flagFile(file.name, 'Skipped', \"Not in GSTR-2B portal format - 'Read me' sheet and GSTR-2B transaction sheets not found\");\n      skippedCount++;\n      progressCallback(\"    SKIPPED: not a GSTR-2B file\");\n      continue;\n    }\n\n    const meta = getReadmeInfo(wb);\n    logRows.fileMeta.set(file.name, { gstin: String(meta[\"GSTIN\"] || \"\").trim(), legal: meta[\"Legal Name\"] || \"\", fy: meta[\"Financial Year\"] || \"\", period: meta[\"Tax Period\"] || \"\" });\n    const issues = [];   // reasons this file deviates from the GST portal format (file is still consolidated)\n    if (!wb.SheetNames.includes(\"Read me\")) issues.push(\"'Read me' sheet missing (file may have been edited or re-saved)\");\n    processedCount++;\n    if (meta[\"GSTIN\"]) gstins.add(String(meta[\"GSTIN\"]).trim());\n\n    // Format-change detection: warn (once per sheet name) about sheets this tool does not know,\n    // since they would otherwise be silently left out of the consolidated workbook.\n    for (const sn of wb.SheetNames) {\n      if (SHEETS_TO_CONSOLIDATE.includes(sn) || KNOWN_IGNORED_SHEETS.includes(sn)) continue;\n      issues.push(`unrecognised sheet \"${sn}\"`);\n      if (unknownSheets.has(sn)) continue;\n      unknownSheets.set(sn, file.name);\n      const msg = `WARNING: unrecognised sheet \"${sn}\" - not consolidated. The GSTR-2B format may have changed; the sheet list in this tool may need updating`;\n      logRows.push([file.name, sn, 0, msg]);\n      progressCallback(`    ${msg}`);\n      warningCount++;\n    }\n    // Format-change detection: header details come from the \"Read me\" sheet by label\n    const missingMeta = [\"Financial Year\", \"Tax Period\", \"GSTIN\", \"Legal Name\"].filter(k => !meta[k]);\n    if (missingMeta.length && wb.SheetNames.includes(\"Read me\")) {\n      issues.push(`could not read ${missingMeta.join(\", \")} from 'Read me' sheet (layout or labels changed)`);\n    }\n    if (meta[\"GSTIN\"] && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$/.test(String(meta[\"GSTIN\"]).trim().toUpperCase())) {\n      issues.push(`GSTIN \"${String(meta[\"GSTIN\"]).trim()}\" in 'Read me' sheet is not a valid 15-character GSTIN`);\n    }\n    if (missingMeta.length) {\n      const msg = `WARNING: could not read ${missingMeta.join(\", \")} from the 'Read me' sheet - its layout or labels may have changed; these columns will be blank`;\n      logRows.push([file.name, \"-\", 0, msg]);\n      progressCallback(`    ${msg}`);\n      warningCount++;\n    }\n\n    // Same GSTIN + period appearing twice (e.g. file saved in two folders) would double-count\n    if (meta[\"GSTIN\"] && meta[\"Tax Period\"]) {\n      const pKey = `${String(meta[\"GSTIN\"]).trim()}|${meta[\"Financial Year\"]}|${meta[\"Tax Period\"]}`;\n      if (seenPeriods.has(pKey)) {\n        const msg = `WARNING: same GSTIN/period as ${seenPeriods.get(pKey)} - possible duplicate, data will be counted twice`;\n        logRows.push([file.name, \"-\", 0, msg]);\n        progressCallback(`    ${msg}`);\n        warningCount++;\n      } else {\n        seenPeriods.set(pKey, file.name);\n      }\n    }\n\n    for (const sheetName of SHEETS_TO_CONSOLIDATE) {\n      if (!wb.SheetNames.includes(sheetName)) {\n        logRows.push([file.name, sheetName, 0, \"sheet not found in file\"]);\n        continue;\n      }\n      try {\n        const ws = wb.Sheets[sheetName];\n        const { headers, dataRows } = extractSheetData(ws);\n\n        let idxMap;\n        if (consolidated[sheetName].headers === null) {\n          consolidated[sheetName].headers = headers.slice();\n          idxMap = headers.map((_, i) => i);\n        } else {\n          idxMap = mergeHeaders(consolidated[sheetName].headers, headers);\n        }\n\n        const masterLen = consolidated[sheetName].headers.length;\n        for (const rowVals of dataRows) {\n          const aligned = new Array(masterLen).fill(null);\n          rowVals.forEach((val, srcIdx) => { if (srcIdx \u003c idxMap.length) aligned[idxMap[srcIdx]] = val; });\n          consolidated[sheetName].rows.push([file.name, meta[\"Financial Year\"], meta[\"Tax Period\"], meta[\"GSTIN\"], meta[\"Legal Name\"], ...aligned]);\n        }\n\n        logRows.push([file.name, sheetName, dataRows.length, dataRows.length ? \"ok\" : \"no data rows\"]);\n        if (dataRows.length) progressCallback(`    ${sheetName}: ${dataRows.length} row(s)`);\n      } catch (e) {\n        logRows.push([file.name, sheetName, 0, `ERROR: ${e.message}`]);\n        issues.push(`could not read sheet \"${sheetName}\" (${e.message})`);\n      }\n    }\n    if (issues.length) flagFile(file.name, 'Processed - please review', issues.join('; '));\n  }\n\n  reportNonStandard(nonStandard, progressCallback);\n\n  if (processedCount === 0) {\n    const err = new Error(\"None of the selected files look like GSTR-2B workbooks.\");\n    err.nonStandardFiles = nonStandard;\n    throw err;\n  }\n\n  // Later amendments replace the original invoices/notes (all files are loaded by now)\n  const amend = reconcileAmendments(consolidated, logRows, progressCallback);\n\n  return {\n    consolidated, logRows, filesProcessed: processedCount, skippedCount, warningCount, nonStandardFiles: nonStandard,\n    gstins: Array.from(gstins).sort(),\n    amendStats: { removed: amend.removed + amend.chainRemoved, linked: amend.linked, comparisons: amend.comparisons },\n  };\n}\n\n// ----------------------------------------------------------------------------\n// Output-only sheet splitting (does NOT affect the Value Summary or Summary sheets)\n//   B2B, B2BA           -> 3 sheets:\n//        1. \"B2B\"                     : Supply Attract Reverse Charge = No  AND ITC Availability = Yes\n//        2. \"B2B ITC Not Available\"   : ITC Availability = No\n//        3. \"B2B Reverse Charge\"      : Supply Attract Reverse Charge = Yes\n//   B2B-CDNR, B2B-CDNRA -> 2 sheets by \"Credit note/Debit note details - Note type\"\n//        1. \"B2B-CDNR Credit Note\"\n//        2. \"B2B-CDNR Debit Note\"\n// Precedence (same as Value Summary): Reverse Charge = Yes first, then ITC = No, rest = main.\n// Every row lands in exactly one sheet, so totals always reconcile with the Value Summary.\n// ----------------------------------------------------------------------------\nconst SPLIT_MODES = {\n  \"B2B\": \"rcm_itc\",\n  \"B2BA\": \"rcm_itc\",\n  \"B2B-CDNR\": \"note_type\",\n  \"B2B-CDNRA\": \"note_type\",\n};\n\nfunction isItcNo(val) {\n  if (val == null) return false;\n  const v = String(val).trim().toLowerCase();\n  return v === 'no' || v === 'not available' || v === 'itc not available';\n}\nfunction isDebitNoteVal(val) {\n  return val != null && String(val).trim().toLowerCase() === 'debit note';\n}\n\nfunction splitRowsForOutput(sheetName, content) {\n  const mode = SPLIT_MODES[sheetName];\n  const rows = content.rows;\n  if (!mode) return [{ title: sheetName, rows }];\n\n  const offset = EXTRA_COLUMNS.length;\n  const cols = classifyValueColumns(content.headers);\n  const colIndex = (key) => cols[key] != null ? offset + cols[key] : null;\n  const cell = (r, i) => (i != null && i \u003c r.length) ? r[i] : null;\n\n  if (mode === \"rcm_itc\") {\n    const rcmIdx = colIndex(\"rcm\");\n    const itcIdx = colIndex(\"itc_availability\");\n    const main = [], notAvail = [], rcm = [];\n    for (const r of rows) {\n      if (isReverseChargeYes(cell(r, rcmIdx))) rcm.push(r);\n      else if (isItcNo(cell(r, itcIdx))) notAvail.push(r);\n      else main.push(r);\n    }\n    return [\n      { title: sheetName, rows: main },\n      { title: `${sheetName} ITC Not Available`, rows: notAvail },\n      { title: `${sheetName} Reverse Charge`, rows: rcm },\n    ];\n  }\n\n  // mode === \"note_type\"\n  const ntIdx = colIndex(\"note_type\");\n  const credit = [], debit = [];\n  for (const r of rows) {\n    if (isDebitNoteVal(cell(r, ntIdx))) debit.push(r);\n    else credit.push(r);\n  }\n  return [\n    { title: `${sheetName} Credit Note`, rows: credit },\n    { title: `${sheetName} Debit Note`, rows: debit },\n  ];\n}\n\n// ============================================================================\n// \"All ITC\" sheet: every ITC row from the individual sheets in one flat list.\n//   * excludes rows where ITC Availability = No\n//   * excludes the (Rejected) sheets (ITC rejected in IMS) and the (ITC Reversal) sheets\n//     (records that reduce ITC) - they are simply not in ALL_ITC_SHEETS\n//   * credit notes (Note type / Document type containing \"Credit\") are shown as NEGATIVE\n//   * blank value cells are shown as 0\n//   * \"ITC Type\" = name of the individual output sheet the row lives in\n// ============================================================================\nconst ALL_ITC_SHEETS = [\n  \"B2B\", \"B2BA\", \"B2B-CDNR\", \"B2B-CDNRA\", \"B2B-DNR\", \"B2B-DNRA\",\n  \"ECO\", \"ECOA\", \"ISD\", \"ISDA\", \"IMPG\", \"IMPGA\", \"IMPGSEZ\", \"IMPGSEZA\",\n];\nconst ALL_ITC_COLUMNS = [\n  \"Sr. No.\", \"Tax Period\", \"GSTIN\", \"Legal Name\",\n  \"GSTIN of supplier\", \"Trade/Legal name\",\n  \"Invoice/Note/Document Number\", \"Invoice/Note/Document Date\",\n  \"Invoice Value(₹)\", \"Taxable Value(₹)\", \"Integrated Tax(₹)\", \"Central Tax(₹)\", \"State/UT Tax(₹)\", \"Cess(₹)\",\n  \"ITC Type (Individual Sheet Name Reference)\",\n];\n\nfunction isItcNoAll(val) {\n  if (val == null) return false;\n  const v = String(val).trim().toLowerCase();\n  return v === 'no' || v === 'not available' || v === 'itc not available' || v === 'ineligible' || v === 'not eligible';\n}\n\n// Sheets name their columns differently (invoice / note / ISD document / bill of entry ...),\n// so each field is located by keywords in the flattened header text.\nfunction locateAllItcColumns(headers) {\n  const hl = headers.map(h => String(h).toLowerCase());\n  const has = (h, words) => words.some(w => h.includes(w));\n  const first = (pred) => { const i = hl.findIndex(pred); return i \u003c 0 ? null : i; };\n  const base = classifyValueColumns(headers);     // doc_value, taxable, igst, cgst, sgst, cess, itc_availability\n  const typeWords = [\"note type\", \"document type\"];\n  return {\n    ...base,\n    supplierGstin: first(h => h.includes(\"gstin of\") && !has(h, [\"recipient\", \"original\"])),\n    supplierName:  first(h => h.includes(\"trade/legal name\")) ?? first(h => h.includes(\"trade\") && h.includes(\"name\")),\n    docNo:   first(h => h.includes(\"number\") && !has(h, [\"original\", \"irn\", \"gstin\"])),\n    docDate: first(h => h.includes(\"date\") && !has(h, [\"filing\", \"icegate\", \"irn\", \"original\", \"reference\", \"period\", \"declared\", \"reduction\"])),\n    docType: first(h => has(h, typeWords) && !h.includes(\"original\")) ?? first(h => has(h, typeWords)),\n    itcAvail: base.itc_availability ?? first(h => h.includes(\"eligibility of itc\")),\n  };\n}\n\nfunction buildAllItc(consolidated) {\n  const offset = EXTRA_COLUMNS.length;\n  const items = [];\n  let excludedNo = 0, seq = 0, partOrder = 0;\n\n  for (const sheetName of ALL_ITC_SHEETS) {\n    const content = consolidated[sheetName];\n    if (!content || content.headers == null) continue;\n    const c = locateAllItcColumns(content.headers);\n    const at = (r, i) => (i == null || offset + i >= r.length) ? null : r[offset + i];\n\n    for (const part of splitRowsForOutput(sheetName, content)) {\n      partOrder++;\n      for (const r of part.rows) {\n        if (isItcNoAll(at(r, c.itcAvail))) { excludedNo++; continue; }\n        const typeVal = at(r, c.docType);\n        const isCredit = typeVal != null && String(typeVal).toLowerCase().includes('credit');\n        // value columns: a missing column or an empty cell is shown as 0 (never blank, never -0)\n        const money = (i) => {\n          const n = toNumber(at(r, i));          // toNumber(null / '' / text) -> 0\n          if (n === 0) return 0;\n          return isCredit ? -Math.abs(n) : n;\n        };\n        items.push({\n          g: String(r[3] == null ? '' : r[3]).trim(),\n          key: fiscalPeriodSortKey(r),\n          partOrder, seq: seq++,\n          out: [null, taxPeriodLabel(r), r[3], r[4],\n                at(r, c.supplierGstin), at(r, c.supplierName), at(r, c.docNo), at(r, c.docDate),\n                money(c.doc_value), money(c.taxable), money(c.igst), money(c.cgst), money(c.sgst), money(c.cess),\n                part.title],\n        });\n      }\n    }\n  }\n\n  // GSTIN-wise, then by financial year / month, then by ITC type, then original order\n  items.sort((a, b) => a.g.localeCompare(b.g) || (a.key[0] - b.key[0]) || (a.key[1] - b.key[1]) ||\n                       (a.partOrder - b.partOrder) || (a.seq - b.seq));\n  items.forEach((it, i) => { it.out[0] = i + 1; });\n  return { rows: items.map(it => it.out), excludedNo };\n}\n\n\n// Summary sheet file table: ONE ROW PER FILE (GSTIN / period). Everything that used to be a separate\n// row per sheet - rows added, rows removed, empty / missing sheets - is merged into one cell.\nfunction writeFileSummary(ws, logRows, headerFont, headerFill) {\n  const metaMap = logRows.fileMeta || new Map();\n  const perFile = new Map();\n  const general = [];\n  const get = (f) => {\n    if (!perFile.has(f)) perFile.set(f, { added: new Map(), removed: new Map(), noData: [], notFound: [], remarks: [] });\n    return perFile.get(f);\n  };\n  logRows.forEach(([file, sheet, n, note]) => {\n    const nt = String(note == null ? '' : note);\n    if (file === '-' || file == null) { general.push((sheet && sheet !== '-' ? sheet + ': ' : '') + nt); return; }\n    const o = get(file);\n    if (n > 0 && nt === 'ok') o.added.set(sheet, (o.added.get(sheet) || 0) + n);\n    else if (n \u003c 0) o.removed.set(sheet, (o.removed.get(sheet) || 0) + n);\n    else if (nt === 'no data rows') o.noData.push(sheet);\n    else if (nt === 'sheet not found in file') o.notFound.push(sheet);\n    else o.remarks.push((sheet && sheet !== '-' ? '[' + sheet + '] ' : '') + nt);\n  });\n\n  const items = [...perFile.entries()].map(([file, o]) => {\n    const m = metaMap.get(file) || { gstin: '', legal: '', fy: '', period: '' };\n    const sum = (mp) => [...mp.values()].reduce((s, v) => s + v, 0);\n    const added = sum(o.added), removed = sum(o.removed);\n    const lines = [];\n    if (o.added.size) lines.push('Rows added (' + added + '): ' + [...o.added].map(([s, n]) => s + ' ' + n).join(' · '));\n    if (o.removed.size) lines.push('Removed - superseded by amendment (' + removed + '): ' + [...o.removed].map(([s, n]) => s + ' ' + n).join(' · '));\n    const tail = [];\n    if (o.noData.length) tail.push('Empty sheets: ' + o.noData.length);\n    if (o.notFound.length) tail.push('Not in file: ' + o.notFound.length);\n    if (tail.length) lines.push(tail.join(' · '));\n    if (!o.added.size && !o.removed.size && !o.noData.length && !o.notFound.length) lines.push('No data read');\n    const full = [];\n    if (o.noData.length) full.push('Sheets with no data rows: ' + o.noData.join(', '));\n    if (o.notFound.length) full.push('Sheets not found in file: ' + o.notFound.join(', '));\n    return { file, m, o, added, removed, net: added + removed, detail: lines.join('\\n'), full: full.join('\\n'),\n             remarks: o.remarks.join('\\n'), bad: o.remarks.some(t => /FAILED|SKIPPED|ERROR/.test(t)) };\n  });\n  // GSTIN-wise, then by financial year / month (same ordering as the data sheets); unreadable files last\n  items.sort((a, b) => (!a.m.gstin) - (!b.m.gstin) || a.m.gstin.localeCompare(b.m.gstin) ||\n    (fiscalPeriodSortKey([a.file, a.m.fy, a.m.period])[0] - fiscalPeriodSortKey([b.file, b.m.fy, b.m.period])[0]) ||\n    (fiscalPeriodSortKey([a.file, a.m.fy, a.m.period])[1] - fiscalPeriodSortKey([b.file, b.m.fy, b.m.period])[1]) ||\n    a.file.localeCompare(b.file));\n\n  ws.addRow([]);\n  const COLS = ['File', 'GSTIN', 'Legal Name', 'Financial Year', 'Tax Period', 'Net Rows', 'Sheet-wise data (all sheets in one cell)', 'Remarks / Warnings'];\n  const hdr = ws.addRow(COLS);\n  hdr.eachCell(cell => { cell.font = headerFont; cell.fill = headerFill; cell.alignment = { wrapText: true, vertical: 'middle' }; });\n  const headerRowNo = hdr.number;\n  items.forEach(it => {\n    const row = ws.addRow([it.file, it.m.gstin, it.m.legal, it.m.fy, it.m.period, it.net, it.detail, it.remarks || 'OK']);\n    row.eachCell(cell => { cell.alignment = { wrapText: true, vertical: 'top' }; });\n    if (it.full) row.getCell(7).note = it.full;           // full list of empty / missing sheets on hover\n    const fill = it.bad ? 'FFFDE8E4' : it.remarks ? 'FFFFF4D6' : null;\n    if (fill) row.eachCell(cell => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fill } }; });\n  });\n  const tot = ws.addRow(['TOTAL - ' + items.length + ' file(s)', '', '', '', '', items.reduce((s, x) => s + x.net, 0), '', '']);\n  tot.eachCell(cell => { cell.font = { bold: true }; cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } }; });\n  if (items.length) ws.autoFilter = { from: { row: headerRowNo, column: 1 }, to: { row: headerRowNo, column: COLS.length } };\n  if (general.length) {\n    ws.addRow([]);\n    const g = ws.addRow(['General notes']); g.getCell(1).font = { bold: true };\n    general.forEach(t => ws.addRow([t]));\n  }\n  [58, 18, 30, 12, 12, 11, 78, 56].forEach((w, i) => { ws.getColumn(i + 1).width = w; });\n}\n\nasync function buildOutputWorkbook(consolidated, logRows, filesProcessed, gstins = [], amendStats = { removed: 0, linked: 0, comparisons: [] }, nonStandardFiles = []) {\n  const wb = new ExcelJS.Workbook();\n  const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4E78' } };\n  const headerFont = { color: { argb: 'FFFFFFFF' }, bold: true };\n\n  let totalRowsWritten = 0;\n  const summarySheet = wb.addWorksheet(\"Summary\");\n  if (nonStandardFiles.length) {\n    const nsSheet = wb.addWorksheet(\"Non-Standard Files\");\n    nsSheet.addRow([\"No.\", \"File\", \"Status\", \"Reason (not as per GST portal GSTR-2B format)\"]);\n    nsSheet.getRow(1).eachCell(cell => { cell.font = headerFont; cell.fill = headerFill; });\n    nonStandardFiles.forEach((x, i) => nsSheet.addRow([i + 1, x.file, x.status, x.reason]));\n    nsSheet.eachRow(row => row.eachCell(cell => { cell.alignment = { wrapText: true, vertical: 'top' }; }));\n    [6, 55, 24, 90].forEach((w, i) => nsSheet.getColumn(i + 1).width = w);\n    nsSheet.views = [{ state: 'frozen', ySplit: 1 }];\n  }\n  const valueSummarySheet = wb.addWorksheet(\"Value Summary\");\n  const allItcSheet = wb.addWorksheet(\"All ITC\");     // created here so it sits right after Value Summary\n  const amendCmpSheet = wb.addWorksheet(\"Amended Inv. Comparison\");   // sits right after All ITC\n  const allItc = buildAllItc(consolidated);\n\n  for (const sheetName of Object.keys(consolidated)) {\n    const content = consolidated[sheetName];\n    if (content.headers === null) continue;\n\n    // Amended sheets (B2BA, B2B-CDNRA) carry the ORIGINAL period details right beside the\n    // amendment's own Financial Year / Tax Period / GSTIN / Legal Name columns.\n    const isAmend = AMEND_SHEET_NAMES.has(sheetName);\n    const fullHeader = isAmend\n      ? [...EXTRA_COLUMNS, ...ORIG_PERIOD_COLUMNS, ...content.headers]\n      : [...EXTRA_COLUMNS, ...content.headers];\n    const toOutRow = (r) => {\n      if (!isAmend) return r;\n      const o = r.__orig || {};\n      return [...r.slice(0, EXTRA_COLUMNS.length),\n              o.fy == null ? '' : o.fy, o.period == null ? '' : o.period, o.file == null ? '' : o.file,\n              ...r.slice(EXTRA_COLUMNS.length)];\n    };\n    const parts = splitRowsForOutput(sheetName, content);\n\n    // Safety check: splitting must never lose or duplicate a row\n    const splitTotal = parts.reduce((n, p) => n + p.rows.length, 0);\n    if (splitTotal !== content.rows.length) {\n      throw new Error(`Row mismatch while splitting ${sheetName}: ${splitTotal} vs ${content.rows.length}`);\n    }\n\n    for (const part of parts) {\n      const ws = wb.addWorksheet(part.title.substring(0, 31));\n      ws.addRow(fullHeader);\n      ws.getRow(1).eachCell(cell => {\n        cell.font = headerFont;\n        cell.fill = headerFill;\n        cell.alignment = { wrapText: true, vertical: 'middle' };\n      });\n      ws.views = [{ state: 'frozen', ySplit: 1 }];\n\n      // Group by GSTIN first (column 4), then by financial year / month. With a single GSTIN\n      // this is identical to the earlier month-wise ordering.\n      const sortedRows = part.rows\n        .map(r => ({ g: String(r[3] == null ? '' : r[3]).trim(), key: fiscalPeriodSortKey(r), row: r }))\n        .sort((a, b) => a.g.localeCompare(b.g) || (a.key[0] - b.key[0]) || (a.key[1] - b.key[1]))\n        .map(x => x.row);\n\n      sortedRows.forEach(r => ws.addRow(toOutRow(r)));\n      totalRowsWritten += sortedRows.length;\n\n      fullHeader.forEach((colName, i) => {\n        ws.getColumn(i + 1).width = Math.min(Math.max(12, String(colName).length + 2), 35);\n      });\n    }\n  }\n\n  summarySheet.addRow([\"Consolidation run\", new Date().toLocaleString()]);\n  summarySheet.addRow([\"Files processed\", filesProcessed]);\n  summarySheet.addRow([\"Total data rows written\", totalRowsWritten]);\n  summarySheet.addRow([\"GSTINs consolidated\", gstins.length]);\n  summarySheet.addRow([\"Files not as per GST portal GSTR-2B format\", nonStandardFiles.length]);\n  if (gstins.length) summarySheet.addRow([\"GSTIN list\", gstins.join(\", \")]);\n  summarySheet.addRow([\"Superseded rows removed (amended in same/later period)\", amendStats.removed]);\n  summarySheet.addRow([\"Amended rows linked to original tax period\", amendStats.linked]);\n  summarySheet.addRow([\"All ITC sheet - rows\", allItc.rows.length]);\n  summarySheet.addRow([\"Rows left out of All ITC (ITC Availability = No)\", allItc.excludedNo]);\n\n\n  const vs = buildValueSummary(consolidated);\n  vs.rows.forEach(r => valueSummarySheet.addRow(r));\n  const totalFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9EEF5' } };\n  const totalBorder = { top: { style: 'thin' } };\n  vs.types.forEach((t, i) => {\n    const rowNo = i + 1;\n    if (t === 'header') {\n      valueSummarySheet.getRow(rowNo).eachCell(cell => { cell.font = headerFont; cell.fill = headerFill; });\n    } else if (t === 'data') {\n      for (let c = 4; c \u003c= 9; c++) valueSummarySheet.getCell(rowNo, c).numFmt = '#,##0.00';\n    } else if (t === 'grandtotal') {\n      valueSummarySheet.getRow(rowNo).eachCell(cell => {\n        cell.font = { bold: true }; cell.fill = totalFill; cell.border = totalBorder;\n      });\n      for (let c = 4; c \u003c= 9; c++) valueSummarySheet.getCell(rowNo, c).numFmt = '#,##0.00';\n    }\n  });\n  valueSummarySheet.views = [{ state: 'frozen', ySplit: 1 }];\n  [22, 32, 12, 20, 16, 16, 14, 14, 12].forEach((w, i) => valueSummarySheet.getColumn(i + 1).width = w);\n\n  // ---- All ITC sheet ----\n  allItcSheet.addRow(ALL_ITC_COLUMNS);\n  allItcSheet.getRow(1).eachCell(cell => {\n    cell.font = headerFont; cell.fill = headerFill;\n    cell.alignment = { wrapText: true, vertical: 'middle' };\n  });\n  allItc.rows.forEach(r => allItcSheet.addRow(r));\n  for (let rn = 2; rn \u003c= allItc.rows.length + 1; rn++) {\n    for (let c = 9; c \u003c= 14; c++) allItcSheet.getCell(rn, c).numFmt = '#,##0.00';\n  }\n\n  // Grand total row: value columns already carry credit notes as negatives and exclude ITC\n  // Availability = No / Rejected sheets (All ITC never includes those rows), so a straight sum works.\n  const gtSums = [0, 0, 0, 0, 0, 0];   // Invoice Value, Taxable Value, IGST, CGST, SGST, Cess\n  allItc.rows.forEach(r => { for (let k = 0; k \u003c 6; k++) gtSums[k] += (r[8 + k] || 0); });\n  const gtRowValues = new Array(ALL_ITC_COLUMNS.length).fill('');\n  for (let k = 0; k \u003c 6; k++) gtRowValues[8 + k] = gtSums[k];\n  const gtRow = allItcSheet.addRow(gtRowValues);\n  const gtRowNo = gtRow.number;\n  allItcSheet.mergeCells(gtRowNo, 1, gtRowNo, 8);\n  allItcSheet.getCell(gtRowNo, 1).value = 'Grand Total';\n  allItcSheet.getRow(gtRowNo).eachCell(cell => {\n    cell.font = { bold: true };\n    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9EEF5' } };\n    cell.border = { top: { style: 'thin' } };\n  });\n  for (let c = 9; c \u003c= 14; c++) allItcSheet.getCell(gtRowNo, c).numFmt = '#,##0.00';\n\n  allItcSheet.views = [{ state: 'frozen', ySplit: 1 }];\n  allItcSheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: ALL_ITC_COLUMNS.length } };\n  [8, 14, 20, 24, 20, 26, 24, 16, 16, 16, 16, 16, 16, 12, 30].forEach((w, i) => allItcSheet.getColumn(i + 1).width = w);\n\n  // ---- Amended Inv. Comparison sheet ----\n  // One row per original invoice/note that was later amended (B2BA / B2B-CDNRA / B2B-DNRA), with the\n  // original values, the amended values and the difference. Amendments whose original is not in the\n  // uploaded files are listed as \"Newly reported in amendment\" (difference = full amended value).\n  const cmpRows = (amendStats && amendStats.comparisons) ? amendStats.comparisons.slice() : [];\n  cmpRows.sort((x, y) => String(x.recipient || '').localeCompare(String(y.recipient || '')) ||\n                         (x.sortKey[0] - y.sortKey[0]) || (x.sortKey[1] - y.sortKey[1]) ||\n                         String(x.supplier).localeCompare(String(y.supplier)));\n  const CMP_FIELDS = [\"doc_value\", \"taxable\", \"igst\", \"cgst\", \"sgst\", \"cess\"];\n  const CMP_LABELS = [\"Doc Value\", \"Taxable Value\", \"Integrated Tax\", \"Central Tax\", \"State/UT Tax\", \"Cess\"];\n  const CMP_INFO = [\"Recipient GSTIN\", \"Legal Name\", \"Document Type\", \"Supplier GSTIN\", \"Supplier Name\",\n    \"Original Doc No.\", \"Original Doc Date\", \"Revised Doc No.\", \"Revised Doc Date\", \"No. of Amendments Reported\", \"Status\",\n    \"Original Financial Year\", \"Original Tax Period\", \"Original Source File\",\n    \"Amendment Financial Year\", \"Amendment Tax Period\", \"Amendment Source File\"];\n  const CMP_HEADER = [...CMP_INFO,\n    ...CMP_LABELS.map(l => `Original - ${l}`),\n    ...CMP_LABELS.map(l => `Amended - ${l}`),\n    ...CMP_LABELS.map(l => `Difference - ${l}`),\n    \"Difference - Total Tax\"];\n  amendCmpSheet.addRow(CMP_HEADER);\n  const groupFills = { orig: 'FF7F6000', amend: 'FF375623', diff: 'FF833C0B' };\n  amendCmpSheet.getRow(1).eachCell((cell, c) => {\n    cell.font = headerFont;\n    cell.fill = c > CMP_INFO.length + 18 ? { type: 'pattern', pattern: 'solid', fgColor: { argb: groupFills.diff } }\n             : c > CMP_INFO.length + 12 ? { type: 'pattern', pattern: 'solid', fgColor: { argb: groupFills.amend } }\n             : c > CMP_INFO.length + 6  ? { type: 'pattern', pattern: 'solid', fgColor: { argb: groupFills.orig } }\n             : headerFill;\n    cell.alignment = { wrapText: true, vertical: 'middle' };\n  });\n  const numFmt = '#,##0.00;[Red]-#,##0.00';\n  cmpRows.forEach(x => {\n    const blank6 = CMP_FIELDS.map(() => '');\n    const row = [x.recipient, x.legalName, x.docType, x.supplier, x.supplierName,\n      x.origNo, x.origDate, x.revNo, x.revDate, x.amendCount, x.status,\n      x.origFy, x.origPeriod, x.origFile, x.amFy, x.amPeriod, x.amFile,\n      ...(x.oVals ? CMP_FIELDS.map(f => x.oVals[f]) : blank6),\n      ...CMP_FIELDS.map(f => x.aVals[f]),\n      ...CMP_FIELDS.map(f => x.diff[f]),\n      x.totTaxDiff];\n    const rn = amendCmpSheet.addRow(row).number;\n    for (let c = CMP_INFO.length + 1; c \u003c= CMP_HEADER.length; c++) amendCmpSheet.getCell(rn, c).numFmt = numFmt;\n    const st = amendCmpSheet.getCell(rn, 11);\n    const argb = x.status === \"Increased\" ? 'FFE2EFDA' : x.status === \"Decreased\" ? 'FFFCE4D6'\n               : x.status === \"Newly reported in amendment\" ? 'FFDDEBF7' : null;\n    if (argb) st.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } };\n  });\n  amendCmpSheet.views = [{ state: 'frozen', ySplit: 1 }];\n  amendCmpSheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: CMP_HEADER.length } };\n  CMP_HEADER.forEach((h, i) => {\n    amendCmpSheet.getColumn(i + 1).width = i \u003c CMP_INFO.length ? Math.min(Math.max(14, h.length + 2), 30) : 17;\n  });\n  summarySheet.addRow([\"Amended Inv. Comparison sheet - rows\", cmpRows.length]);\n  writeFileSummary(summarySheet, logRows, headerFont, headerFill);\n\n  return { workbook: wb, totalRowsWritten, allItcRows: allItc.rows.length, allItcData: allItc.rows, amendCmpRows: cmpRows.length };\n}\n\n// ============================================================================\n// UI glue\n// ============================================================================\n\nlet selectedFiles = [];   // { file, path, dir, baseName, size, key }\nconst dropzone = document.getElementById('dropzone');\nconst fileInput = document.getElementById('fileInput');\nconst folderInput = document.getElementById('folderInput');\nconst addFolderBtn = document.getElementById('addFolderBtn');\nconst addFilesBtn = document.getElementById('addFilesBtn');\nconst clearBtn = document.getElementById('clearBtn');\nconst fileListEl = document.getElementById('fileList');\nconst fileSummaryEl = document.getElementById('fileSummary');\nconst submitBtn = document.getElementById('submitBtn');\nconst form = document.getElementById('uploadForm');\nconst logEl = document.getElementById('log');\nconst flashArea = document.getElementById('flashArea');\nconst downloadArea = document.getElementById('downloadArea');\nconst downloadLink = document.getElementById('downloadLink');\nconst LOOSE_LABEL = '(individual files)';\n\nfunction showFlash(message, type) {\n  flashArea.innerHTML = `\u003cdiv class=\"flash ${type || ''}\">${message}\u003c/div>`;\n}\nfunction clearFlash() { flashArea.innerHTML = ''; }\n\nconst nonStdArea = document.getElementById('nonStdArea');\nfunction escHtml(t) { return String(t).replace(/[&\u003c>\"]/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c])); }\nfunction renderNonStandard(list) {\n  if (!list || !list.length) { nonStdArea.style.display = 'none'; nonStdArea.innerHTML = ''; return; }\n  nonStdArea.innerHTML =\n    `\u003ch3>${list.length} file(s) not as per the GST portal GSTR-2B format\u003c/h3>` +\n    `\u003cp>Please re-download these files from the GST portal and upload them without any changes. The same list is saved in the \"Non-Standard Files\" sheet of the output workbook.\u003c/p>` +\n    `\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>File\u003c/th>\u003cth>Status\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>` +\n    list.map((x, i) => `\u003ctr>\u003ctd>${i + 1}\u003c/td>\u003ctd class=\"f\">${escHtml(x.file)}\u003c/td>\u003ctd>${escHtml(x.status)}\u003c/td>\u003ctd>${escHtml(x.reason)}\u003c/td>\u003c/tr>`).join('') +\n    `\u003c/tbody>\u003c/table>\u003c/div>`;\n  nonStdArea.style.display = 'block';\n}\n\nfunction makeEntry(file, path) {\n  path = String(path || file.name).replace(/^\\/+/, '');\n  const i = path.lastIndexOf('/');\n  return {\n    file, path,\n    dir: i >= 0 ? path.slice(0, i) : '',\n    baseName: i >= 0 ? path.slice(i + 1) : path,\n    size: file.size,\n    // path + size + modified time: identical copies are skipped, different files that happen\n    // to share a name (e.g. \"GSTR2B_042025.xlsx\" in two GSTIN folders) are both kept\n    key: `${path}|${file.size}|${file.lastModified}`,\n  };\n}\n\nfunction groupLabel(e) { return e.dir || LOOSE_LABEL; }\n\nfunction renderFileList() {\n  fileListEl.innerHTML = '';\n  const groups = new Map();\n  selectedFiles.forEach(e => {\n    const k = groupLabel(e);\n    if (!groups.has(k)) groups.set(k, []);\n    groups.get(k).push(e);\n  });\n\n  groups.forEach((items, dir) => {\n    const det = document.createElement('details');\n    const sum = document.createElement('summary');\n    const name = document.createElement('span');\n    name.className = 'dirname';\n    name.textContent = dir === LOOSE_LABEL ? dir : `${dir}/`;\n    const count = document.createElement('span');\n    count.className = 'count';\n    const totalKb = items.reduce((n, e) => n + e.size, 0) / 1024;\n    count.textContent = `${items.length} file(s), ${totalKb.toFixed(0)} KB`;\n    const remove = document.createElement('span');\n    remove.textContent = '✕';\n    remove.className = 'remove';\n    remove.title = 'Remove this folder from the list';\n    remove.onclick = (ev) => {\n      ev.preventDefault(); ev.stopPropagation();\n      selectedFiles = selectedFiles.filter(e => groupLabel(e) !== dir);\n      renderFileList();\n    };\n    sum.appendChild(name); sum.appendChild(count); sum.appendChild(remove);\n    det.appendChild(sum);\n    items.forEach(e => {\n      const row = document.createElement('div');\n      row.className = 'fileRow';\n      row.textContent = `${e.baseName} (${(e.size / 1024).toFixed(0)} KB)`;\n      det.appendChild(row);\n    });\n    fileListEl.appendChild(det);\n  });\n\n  const realFolders = Array.from(groups.keys()).filter(k => k !== LOOSE_LABEL).length;\n  fileSummaryEl.textContent = selectedFiles.length\n    ? `${selectedFiles.length} file(s) selected from ${realFolders} folder(s)` +\n      (groups.has(LOOSE_LABEL) ? ` + ${groups.get(LOOSE_LABEL).length} individual file(s)` : '')\n    : '';\n  submitBtn.disabled = selectedFiles.length === 0;\n}\n\n// rawList: [{ file, path }]\nfunction addEntries(rawList) {\n  const existing = new Set(selectedFiles.map(e => e.key));\n  let added = 0, dup = 0, ignored = 0;\n  for (const { file, path } of rawList) {\n    const e = makeEntry(file, path);\n    if (!e.baseName.toLowerCase().endsWith('.xlsx') || e.baseName.startsWith('~$')) { ignored++; continue; }\n    if (existing.has(e.key)) { dup++; continue; }\n    existing.add(e.key);\n    selectedFiles.push(e);\n    added++;\n  }\n  selectedFiles.sort((a, b) => a.path.localeCompare(b.path));\n  renderFileList();\n  if (added) publishRecoData(null);\n\n  if (added || dup || ignored) {\n    const parts = [`Added ${added} .xlsx file(s)`];\n    if (dup) parts.push(`${dup} already in the list`);\n    if (ignored) parts.push(`${ignored} non-.xlsx / temp file(s) ignored`);\n    showFlash(parts.join(' - '), added ? 'success' : '');\n  }\n}\n\nfunction publishRecoData(payload) {\n  if (window.parent !== window) window.parent.postMessage({ type: 'gst-reco-data', source: '2b', payload }, '*');\n}\nfunction recoSafeValue(value) {\n  if (value == null || typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return value;\n  if (value instanceof Date) return value.toISOString();\n  if (Array.isArray(value)) return value.map(recoSafeValue).join(' ');\n  if (typeof value === 'object') {\n    if (value.result != null) return recoSafeValue(value.result);\n    if (value.text != null) return String(value.text);\n    return String(value);\n  }\n  return '';\n}\nfunction publishRecoAllItc(rows) {\n  publishRecoData({ headers: ALL_ITC_COLUMNS.slice(), rows: rows.map(row => row.map(recoSafeValue)) });\n}\n\n// ---- Folder / file pickers -------------------------------------------------\naddFolderBtn.addEventListener('click', () => folderInput.click());\naddFilesBtn.addEventListener('click', () => fileInput.click());\nclearBtn.addEventListener('click', () => { selectedFiles = []; renderFileList(); clearFlash(); publishRecoData(null); });\n\n// The browser's folder picker takes one folder per dialog: click \"Add Folder\" again to add\n// more GSTIN folders. All sub-folders of a chosen folder are included automatically.\nfolderInput.addEventListener('change', () => {\n  const list = Array.from(folderInput.files).map(f => ({ file: f, path: f.webkitRelativePath || f.name }));\n  folderInput.value = '';\n  addEntries(list);\n});\nfileInput.addEventListener('change', () => {\n  const list = Array.from(fileInput.files).map(f => ({ file: f, path: f.name }));\n  fileInput.value = '';\n  addEntries(list);\n});\n\n// ---- Drag & drop (files, one folder, or several folders at once) -----------\nfunction readAllDirEntries(reader) {\n  // readEntries returns results in batches, so keep calling until it comes back empty\n  return new Promise((resolve, reject) => {\n    const all = [];\n    const next = () => reader.readEntries(batch => {\n      if (!batch.length) resolve(all); else { all.push(...batch); next(); }\n    }, reject);\n    next();\n  });\n}\nasync function walkEntry(entry, out) {\n  if (entry.isFile) {\n    const file = await new Promise((res, rej) => entry.file(res, rej));\n    out.push({ file, path: entry.fullPath });\n  } else if (entry.isDirectory) {\n    const children = await readAllDirEntries(entry.createReader());\n    for (const c of children) await walkEntry(c, out);\n  }\n}\n\n['dragenter', 'dragover'].forEach(evt =>\n  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })\n);\n['dragleave', 'drop'].forEach(evt =>\n  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })\n);\n// Stop the browser from opening a file that is dropped outside the drop area\n['dragover', 'drop'].forEach(evt => window.addEventListener(evt, e => e.preventDefault()));\n\ndropzone.addEventListener('drop', async (e) => {\n  // webkitGetAsEntry must be called synchronously, before any await\n  const items = Array.from((e.dataTransfer && e.dataTransfer.items) || []);\n  const entries = items.map(it => (it.kind === 'file' && it.webkitGetAsEntry) ? it.webkitGetAsEntry() : null).filter(Boolean);\n  const plainFiles = Array.from((e.dataTransfer && e.dataTransfer.files) || []);\n\n  try {\n    const out = [];\n    if (entries.length) {\n      showFlash('Scanning dropped folder(s)...', '');\n      for (const en of entries) await walkEntry(en, out);\n    } else {\n      plainFiles.forEach(f => out.push({ file: f, path: f.name }));\n    }\n    addEntries(out);\n  } catch (err) {\n    console.error(err);\n    showFlash(`Could not read the dropped items: ${err.message}`, 'error');\n  }\n});\n\nform.addEventListener('submit', async (e) => {\n  e.preventDefault();\n  clearFlash();\n  publishRecoData(null);\n  downloadArea.style.display = 'none';\n  renderNonStandard([]);\n  logEl.style.display = 'block';\n  logEl.textContent = '';\n  submitBtn.disabled = true;\n  submitBtn.textContent = 'Processing...';\n\n  const appendLog = (msg) => { logEl.textContent += msg + '\\n'; logEl.scrollTop = logEl.scrollHeight; };\n\n  try {\n    const fileEntries = selectedFiles.map(e => ({ name: e.path, baseName: e.baseName, file: e.file }));\n\n    const { consolidated, logRows, filesProcessed, skippedCount, warningCount, gstins, amendStats, nonStandardFiles } =\n      await consolidateFiles(fileEntries, appendLog);\n    appendLog('Building output workbook...');\n    const { workbook, totalRowsWritten, allItcRows, allItcData, amendCmpRows } = await buildOutputWorkbook(consolidated, logRows, filesProcessed, gstins, amendStats, nonStandardFiles);\n    renderNonStandard(nonStandardFiles);\n    appendLog(`All ITC sheet: ${allItcRows} row(s)`);\n    appendLog(`Amended Inv. Comparison sheet: ${amendCmpRows} row(s)`);\n\n    appendLog(`Done. Total data rows written: ${totalRowsWritten}`);\n\n    const buffer = await workbook.xlsx.writeBuffer();\n    publishRecoAllItc(allItcData);\n    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });\n    const url = URL.createObjectURL(blob);\n\n    downloadLink.href = url;\n    downloadLink.download = 'Consolidated_GSTR2B.xlsx';\n    downloadArea.style.display = 'block';\n\n    let msg = `Consolidated ${filesProcessed} file(s) across ${gstins.length} GSTIN(s), ${totalRowsWritten} data row(s) total. Ready to download.`;\n    if (amendStats && (amendStats.removed || amendStats.linked)) {\n      msg += `\u003cbr>Amendments applied: ${amendStats.removed} superseded row(s) removed, ${amendStats.linked} amended row(s) linked to their original tax period.`;\n    }\n    if (skippedCount) msg += `\u003cbr>${skippedCount} file(s) skipped (not GSTR-2B / unreadable).`;\n    if (warningCount) msg += `\u003cbr>\u003cstrong>${warningCount} warning(s)\u003c/strong> raised - possible duplicate periods, unrecognised sheets or a changed GSTR-2B layout. Please review before relying on the totals.`;\n    if (nonStandardFiles.length) msg += `\u003cbr>\u003cstrong>${nonStandardFiles.length} file(s) not as per the GST portal GSTR-2B format\u003c/strong> - listed below and in the \"Non-Standard Files\" sheet.`;\n    if (skippedCount || warningCount) msg += ' See the Summary sheet for details.';\n    showFlash(msg, (skippedCount || warningCount || nonStandardFiles.length) ? '' : 'success');\n\n  } catch (err) {\n    console.error(err);\n    renderNonStandard(err.nonStandardFiles);\n    showFlash(`Something went wrong: ${err.message}`, 'error');\n  } finally {\n    submitBtn.disabled = selectedFiles.length === 0;\n    submitBtn.textContent

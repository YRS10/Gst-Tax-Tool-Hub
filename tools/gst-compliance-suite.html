re filing returns or relying on them for compliance. These tools support your work and do not replace professional judgement.\u003c/p>\n  \u003c/div>\n\u003c/footer>\n\u003c!-- ytb-footer:end -->\n\u003c/body>\n\u003c/html>\n"</script>

r:#14251f}\n  .modal-head p{margin:0;font-size:13px;color:#617064;line-height:1.55}\n  .x{border:0;background:none;font-size:24px;line-height:1;color:#87928a;cursor:pointer;padding:0 4px}\n  .modal-body{padding:14px 24px 6px;overflow-x:auto}\n  table.portal{width:100%;min-width:760px;border-collapse:collapse;border:1px solid #d9dde1;font-family:Arial,\"Segoe UI\",sans-serif}\n  table.portal th{background:#f5f6f8;color:#222;font-size:15px;font-weight:700;text-align:center;padding:16px 10px;border:1px solid #e1e4e8}\n  table.portal td{padding:12px 14px;border:1px solid #e1e4e8;vertical-align:middle}\n  table.portal td.desc{font-weight:700;font-size:15px;color:#222;width:23%;line-height:1.35}\n  table.portal input{width:100%;background:#eeeeee;border:1px solid #cfd3d7;border-radius:3px;padding:10px 12px;font-size:15px;text-align:right;color:#444;font-family:inherit;font-variant-numeric:tabular-nums}\n  table.portal input:focus{outline:2px solid #1d6b52;background:#fff}\n  .modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:16px 24px 22px;flex-wrap:wrap}\n  .modal-foot .hint{margin-right:auto;font-size:12px;color:#7b877f;max-width:520px}\n  button.btn-ghost{background:#fff;color:#334155;border:1px solid #c9d3e0}\n  button.btn-ghost:hover{background:#f1f5f9}\n  .rtable{width:100%;min-width:760px;border-collapse:collapse;font-size:14px}\n  .rtable th{background:#f8faf8;color:#67756b;font-weight:700;text-align:right;padding:12px 16px;border-bottom:1px solid #e3e8e5;font-size:13px}\n  .rtable th:first-child,.rtable td:first-child{text-align:left}\n  .rtable td{padding:13px 16px;border-bottom:1px solid #edf0ee;text-align:right;font-variant-numeric:tabular-nums;color:#253a30}\n  .rtable td:first-child{font-weight:700}\n  .rtable tr.tot td{background:#f0f7f3;font-weight:800}\n  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}\n  .pill.ok{background:#e4f3ea;color:#1d6b52}.pill.bad{background:#fde8e4;color:#b3261e}.pill.mid{background:#fff3d6;color:#8a5a00}\n  .d-bad{color:#b3261e;font-weight:800}.d-ok{color:#1d6b52;font-weight:800}\n  .recon-banner{border-radius:12px;padding:13px 16px;font-size:14px;margin:0 0 14px;border:1px solid}\n  .recon-banner.ok{background:#e9f6ee;border-color:#bfe0cb;color:#1d5b3a}\n  .recon-banner.warn{background:#fff2ef;border-color:#f0c8bf;color:#873b2c}\n  .find{border:1px solid #e3e8e5;border-radius:14px;background:#fff;margin-bottom:12px;overflow:hidden;box-shadow:0 8px 26px #16332708}\n  .find-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fbfaf3;border-bottom:1px solid #f0e8c9;font-size:13px;color:#5b4a1c}\n  .find-h b{color:#2e2509}\n  .badge{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;background:#1d6b52;color:#fff;margin-right:6px}\n  .badge.weak{background:#9a8a55}\n  .find .table-wrap{max-height:none;margin:0}\n  .find-note{font-size:12px;color:#7b877f;margin:2px 4px 14px}\n  .findings-toggle{margin:14px 0}\n  .findings-toggle>summary{cursor:pointer;list-style:none;border:1px solid #e3e8e5;border-radius:12px;background:#fff;padding:13px 16px;font-size:15px;font-weight:700;color:#253a30;box-shadow:0 8px 26px #16332708}\n  .findings-toggle>summary::-webkit-details-marker{display:none}\n  .findings-toggle>summary::before{content:\"\\25B8\";display:inline-block;margin-right:9px;color:var(--accent);transition:transform .15s}\n  .findings-toggle[open]>summary::before{transform:rotate(90deg)}\n  .findings-body{padding-top:12px}\n  .amend-check{margin:14px 0;padding:14px 16px;border:1px solid #dce9e2;border-radius:12px;background:#f0f7f3;color:#345c48;font-size:13px}\n  .amend-check strong{color:#1e4834}\n  .amend-check details{margin-top:8px}\n  .amend-check summary{cursor:pointer;font-weight:700}\n  footer.sitefoot{margin-top:46px;background:#eef3ef;border-top:1px solid #cfdcd3;color:#5d6b62}\n  footer.sitefoot .inner{max-width:1180px;margin:0 auto;padding:38px 28px 34px}\n  .foot-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding-bottom:30px;border-bottom:1px solid #cfdcd3}\n  .foot-col{border-left:4px solid #b3261e;padding-left:16px}\n  .foot-col h3{margin:0 0 8px;font-size:18px;color:#14251f;font-weight:700}\n  .foot-col p{margin:0;font-size:15px;line-height:1.7;color:#5d6b62}\n  .foot-credit{padding-top:22px;font-size:14px;line-height:1.5}\n  .foot-credit p{margin:0 0 9px;color:#5d6b62}\n  .foot-credit strong{color:#14251f}\n  .foot-credit a{color:#1d6b52;font-weight:700}\n  @media (max-width:760px){.foot-cols{grid-template-columns:1fr;gap:22px}}\n  footer.foot{margin-top:28px;padding:0 0 38px;border:0;font-size:12px;line-height:1.6;color:#7b867f;text-align:center}\n  footer.foot p{margin:0 0 6px}\n  footer.foot .brand{color:#4a5b50;font-weight:700}\n  @media (max-width:760px){.page{padding:23px 16px 0}.step{padding:18px 16px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-cell.big{grid-column:1/-1}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cdiv class=\"topline\">\u003cspan class=\"mark\">8A\u003c/span> GST Compliance Suite\u003c/div>\n\n  \u003cheader class=\"hero\">\n    \u003ch1>GSTR&#8209;9 Table 8A ITC Consolidation Dashboard\u003c/h1>\n    \u003cp class=\"lede\">Upload the auto-populated \u003cstrong>Table 8A\u003c/strong> Excel from the GST portal &ndash; works for \u003cstrong>FY 2024-25\u003c/strong> and \u003cstrong>FY 2025-26\u003c/strong> files. The sheets \u003cstrong>B2B\u003c/strong>, \u003cstrong>B2BA\u003c/strong>, \u003cstrong>B2B-CDNR\u003c/strong>, \u003cstrong>B2B-CDNRA\u003c/strong>, \u003cstrong>ECO\u003c/strong> and \u003cstrong>ECOA\u003c/strong> are consolidated into one output workbook, with excluded entries and amendments reported separately.\u003c/p>\n    \u003cdiv class=\"notice\">\u003cspan aria-hidden=\"true\">●\u003c/span>\u003cdiv>\u003cstrong>Private and local.\u003c/strong> Runs 100% in your browser. Your files are read on your device and never leave it.\u003c/div>\u003c/div>\n    \u003cdiv class=\"important\" role=\"note\">\u003cspan class=\"imp-icon\" aria-hidden=\"true\">!\u003c/span>\u003cdiv>\u003cstrong>Important instruction before uploading.\u003c/strong> Please upload the GSTR-9 Table 8A Excel file exactly as downloaded from the GST portal. Do not rename, edit, re-save or alter the file contents in any way, as modified files may not be read correctly and could produce incomplete or inaccurate consolidated output.\u003c/div>\u003c/div>\n  \u003c/header>\n\n  \u003cdetails class=\"howto\" id=\"howto\">\n    \u003csummary>How to use this tool (instructions, rules applied, outputs)\u003c/summary>\n    \u003cdiv class=\"howto-body\">\n      \u003ch3>Workflow at a glance\u003c/h3>\n      \u003col>\n        \u003cli>\u003cstrong>Step 1:\u003c/strong> upload the Table 8A workbook (\u003ccode>R9_8A_&lt;GSTIN&gt;.xlsx\u003c/code>) of FY 2024-25 or FY 2025-26, exactly as downloaded from the portal. Do not edit the sheets or headings. One file per GSTIN and year.\u003c/li>\n        \u003cli>A pop-up asks for the values shown on the GST portal (GSTR-9 &rarr; Table 8, row \u003cem>(A) ITC as per GSTR-2B\u003c/em>) &ndash; IGST, CGST, SGST and Cess. Key them in, or skip.\u003c/li>\n        \u003cli>\u003cstrong>Step 2:\u003c/strong> click \u003cem>Consolidate Table 8A\u003c/em>. The dashboard shows the Excel consolidation against the portal figures, the difference for each head, and a hit-and-trial search for the entries that can explain the difference.\u003c/li>\n        \u003cli>Download the consolidated Excel and review the totals against Table 8A on the portal.\u003c/li>\n      \u003c/ol>\n\n      \u003ch3>Rules applied\u003c/h3>\n      \u003ctable>\n        \u003ctr>\u003cth>Topic\u003c/th>\u003cth>Treatment\u003c/th>\u003c/tr>\n        \u003ctr>\u003ctd>Tax heads\u003c/td>\u003ctd>IGST / CGST / SGST / Cess come from \u003cem>Actual ITC amount considered for 8A Summary computation\u003c/em> in B2B, B2B-CDNR and ECO. In the amendment sheets (B2BA, B2B-CDNRA, ECOA) the revised \u003cem>Tax amount\u003c/em> columns are used. \u003cstrong>Older files (e.g. FY 2024-25)\u003c/strong> do not have the &ldquo;Actual ITC&rdquo; columns; the tool detects this sheet by sheet and uses the reported \u003cem>Tax amount\u003c/em> columns instead, still excluding ITC &ldquo;No&rdquo; and reverse-charge entries. A note on the results explains when this happened.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Excluded entries\u003c/td>\u003ctd>ITC Availability = \u003ccode>No\u003c/code> (with Reason), or Supply Attract Reverse Charge = \u003ccode>Yes\u003c/code>. They go to a separate sheet and are not part of the consolidated ITC total.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Credit notes\u003c/td>\u003ctd>Note type \u003ccode>CN\u003c/code> is shown negative &ndash; document value, taxable value and every tax head.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>Amendments\u003c/td>\u003ctd>Each amendment row is matched to its original (document number + date; original note type for CDNRA). The amended data is final and replaces the original. The amended ITC availability and reverse-charge flags determine whether the final entry is consolidated or excluded; changes to these flags are explicitly checked and reported. The remark reads \u003cem>value increased\u003c/em>, \u003cem>value decreased\u003c/em>, \u003cem>no change in value\u003c/em> or \u003cem>newly added in amended data\u003c/em>, with difference columns against the original. Replaced originals are listed in \u003cem>Superseded Originals\u003c/em>.\u003c/td>\u003c/tr>\n      \u003c/table>\n\n      \u003ch3>Output workbook\u003c/h3>\n      \u003cul>\n        \u003cli>\u003cstrong>Reconciliation\u003c/strong> &ndash; portal figures, per-head differences and hit-and-trial entries that may explain them (when portal values are entered).\u003c/li>\n        \u003cli>\u003cstrong>Summary\u003c/strong> &ndash; the original consolidation summary with totals by source sheet, excluded totals, amendment impact and record reconciliation.\u003c/li>\n        \u003cli>\u003cstrong>Consolidated\u003c/strong> &ndash; all eligible entries with tax heads, a total row and filters. Amended entries are shaded.\u003c/li>\n        \u003cli>\u003cstrong>Excluded (ITC No - RCM)\u003c/strong> &ndash; entries left out of the ITC total, with exclusion basis and reason. The tax shown is for reference only.\u003c/li>\n        \u003cli>\u003cstrong>Superseded Originals\u003c/strong> &ndash; original entries replaced by amended data.\u003c/li>\n      \u003c/ul>\n      \u003cdiv class=\"tip\">\u003cstrong>Tip.\u003c/strong> For credit notes the &ldquo;increase / decrease&rdquo; remark is judged on the size of the note, so a larger credit note counts as an increase; the difference column keeps the negative sign. Difference columns compare reported tax amounts on both sides.\u003c/div>\n    \u003c/div>\n  \u003c/details>\n\n  \u003csection class=\"panel step\" id=\"step1\">\n    \u003cdiv class=\"step-body\">\n      \u003ch2>\u003cspan class=\"step-num\">1\u003c/span>Upload Table 8A workbook\u003c/h2>\n      \u003cp>Select the Excel file downloaded from the GST portal (FY 2024-25 and FY 2025-26 formats are both supported). \u003cstrong>One GSTIN per file.\u003c/strong>\u003c/p>\n      \u003cdiv class=\"dropzone\" id=\"drop\" role=\"button\" tabindex=\"0\" aria-label=\"Choose or drop the Table 8A Excel file\">\n        \u003cp class=\"dz-title\">Click to choose, or drop the Table 8A .xlsx here\u003c/p>\n        \u003cp class=\"dz-sub\">Accepted: .xlsx / .xlsm\u003c/p>\n      \u003c/div>\n      \u003cinput type=\"file\" id=\"file\" autocomplete=\"off\" accept=\".xlsx,.xlsm\" hidden>\n      \u003cdiv class=\"file-chip\" id=\"chip\" hidden>\u003cspan id=\"fname\">\u003c/span>\u003cbutton type=\"button\" id=\"clear\">Remove\u003c/button>\u003c/div>\n      \u003cdiv class=\"pchip\" id=\"pchip\" hidden>\u003cspan id=\"ptext\">\u003c/span>\u003cbutton type=\"button\" id=\"pedit\">Enter / edit portal values\u003c/button>\u003c/div>\n      \u003cdetails class=\"required-cols\">\n        \u003csummary>Sheets read from the workbook\u003c/summary>\n        \u003cul class=\"col-list\">\n          \u003cli>B2B\u003c/li>\u003cli>B2BA (amendments)\u003c/li>\u003cli>B2B-CDNR\u003c/li>\u003cli>B2B-CDNRA (amendments)\u003c/li>\u003cli>ECO\u003c/li>\u003cli>ECOA (amendments)\u003c/li>\u003cli>Read me (GSTIN / FY details)\u003c/li>\n        \u003c/ul>\n      \u003c/details>\n      \u003cdiv id=\"warns\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"panel step is-disabled\" id=\"step2\">\n    \u003cdiv class=\"step-body\">\n      \u003ch2>\u003cspan class=\"step-num\">2\u003c/span>Consolidate\u003c/h2>\n      \u003cp>Combines all sheets, applies the rules above and prepares the output workbook.\u003c/p>\n      \u003cdiv class=\"run-row\">\n        \u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"run\" disabled>Consolidate Table 8A\u003c/button>\n        \u003cspan class=\"run-status\" id=\"status\">\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"results\" hidden>\n    \u003cdiv class=\"results-note\">Reconciliation with GST portal\u003c/div>\n    \u003cdiv class=\"entity\" id=\"entity\">\u003c/div>\n    \u003cdiv id=\"banner\">\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding:0;overflow:hidden;margin-bottom:16px\">\u003cdiv class=\"table-wrap\" style=\"max-height:none;margin:0\">\u003ctable class=\"rtable\" id=\"rtbl\">\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv id=\"findings\">\u003c/div>\n    \u003cdiv id=\"amendCheck\">\u003c/div>\n    \u003cdiv class=\"summary-grid\" id=\"kpis\">\u003c/div>\n    \u003cdiv class=\"download-row\">\n      \u003cdiv class=\"dl-text\">\u003cdiv class=\"t\">Consolidated Table 8A workbook\u003c/div>\u003cdiv class=\"s\">First sheet: Reconciliation with portal differences and hit-and-trial entries. The original Summary follows, then Consolidated, Excluded (ITC No - RCM) and Superseded Originals.\u003c/div>\u003c/div>\n      \u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"dl\">Download Excel\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"overlay\" id=\"modal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mtitle\">\n    \u003cdiv class=\"modal\">\n      \u003cdiv class=\"modal-head\">\n        \u003cdiv>\u003ch3 id=\"mtitle\">Enter the values shown on the GST portal\u003c/h3>\u003cp>On the GST portal open \u003cstrong>GSTR-9 &rarr; Table 8\u003c/strong> and key in the figures displayed in row \u003cstrong>(A)\u003c/strong>. They are compared with the Excel consolidation, and any difference is traced back to entries.\u003c/p>\u003c/div>\n        \u003cbutton type=\"button\" class=\"x\" id=\"mclose\" aria-label=\"Close\">&times;\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"modal-body\">\n        \u003ctable class=\"portal\">\n          \u003cthead>\u003ctr>\u003cth>Description\u003c/th>\u003cth>Integrated tax (&#8377;)\u003c/th>\u003cth>Central tax (&#8377;)\u003c/th>\u003cth>State/UT tax (&#8377;)\u003c/th>\u003cth>Cess (&#8377;)\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\u003ctr>\n            \u003ctd class=\"desc\">(A) ITC as per GSTR-2B [Table 3(I) thereof]\u003c/td>\n            \u003ctd>\u003cinput id=\"p0\" inputmode=\"decimal\" placeholder=\"&#8377;0.00\" autocomplete=\"off\">\u003c/td>\n            \u003ctd>\u003cinput id=\"p1\" inputmode=\"decimal\" placeholder=\"&#8377;0.00\" autocomplete=\"off\">\u003c/td>\n            \u003ctd>\u003cinput id=\"p2\" inputmode=\"decimal\" placeholder=\"&#8377;0.00\" autocomplete=\"off\">\u003c/td>\n            \u003ctd>\u003cinput id=\"p3\" inputmode=\"decimal\" placeholder=\"&#8377;0.00\" autocomplete=\"off\">\u003c/td>\n          \u003c/tr>\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cdiv class=\"modal-foot\">\n        \u003cspan class=\"hint\">Leave a head blank if the portal shows nothing (treated as 0). You can edit these later.\u003c/span>\n        \u003cbutton type=\"button\" class=\"btn btn-ghost\" id=\"mskip\">Skip reconciliation\u003c/button>\n        \u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"msave\">Save &amp; continue\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cfooter class=\"sitefoot\">\n  \u003cdiv class=\"inner\">\n    \u003cdiv class=\"foot-cols\">\n      \u003cdiv class=\"foot-col\">\u003ch3>Free to use\u003c/h3>\u003cp>No sign-up and no subscription. Open it and start working.\u003c/p>\u003c/div>\n      \u003cdiv class=\"foot-col\">\u003ch3>Your files stay with you\u003c/h3>\u003cp>Everything runs in your browser on your device. Files you select are not uploaded to any server.\u003c/p>\u003c/div>\n      \u003cdiv class=\"foot-col\">\u003ch3>Made for daily work\u003c/h3>\u003cp>Designed around the month-end and return-filing jobs accountants repeat all the time.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"foot-credit\">\n      \u003cp>Designed and developed by \u003cstrong>Yatin Bansal\u003c/strong>.\u003c/p>\n      \u003cp>For feedback, write to \u003ca href=\"mailto:write2me.yrs@gmail.com\">write2me.yrs@gmail.com\u003c/a>.\u003c/p>\n      \u003cp>Always verify results before filing returns or relying on them for compliance. These tools support your work and do not replace professional judgement.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/footer>\n\n\u003c!--GSTLIBS:exceljs-->\n\u003cscript>/* GSTR-9 Table 8A consolidation core. Works in browser (global GST8A) and Node (module.exports). */\n(function (root) {\n  'use strict';\n\n  /* ---------- Sheet layouts (0-based column indexes) ---------- */\n  const LAYOUTS = {\n    'B2B': { kind: 'orig', fam: 'INV', c: { gstin: 0, name: 1, no: 2, type: 3, date: 4, val: 5, pos: 6, rcm: 7, taxable: 8, rep: [9, 10, 11, 12], p1: 13, fd: 14, p2b: 15, itc: 16, act: [17, 18, 19, 20], reason: 21 } },\n    'B2BA': { kind: 'amend', fam: 'INV', c: { oNo: 0, oDate: 1, gstin: 2, name: 3, no: 4, type: 5, date: 6, val: 7, pos: 8, rcm: 9, taxable: 10, rep: [11, 12, 13, 14], p1: 20, fd: 21, p2b: 22, itc: 23, act: [24, 25, 26, 27], reason: 28 } },\n    'B2B-CDNR': { kind: 'orig', fam: 'CDN', c: { gstin: 0, name: 1, no: 2, type: 3, supply: 4, date: 5, val: 6, pos: 7, rcm: 8, taxable: 9, rep: [10, 11, 12, 13], p1: 19, fd: 20, p2b: 21, itc: 22, act: [23, 24, 25, 26], reason: 27 } },\n    'B2B-CDNRA': { kind: 'amend', fam: 'CDN', c: { oType: 0, oNo: 1, oDate: 2, gstin: 3, name: 4, no: 5, type: 6, supply: 7, date: 8, val: 9, pos: 10, rcm: 11, taxable: 12, rep: [13, 14, 15, 16], p1: 22, fd: 23, p2b: 24, itc: 25, act: [26, 27, 28, 29], reason: 30 } },\n    'ECO': { kind: 'orig', fam: 'ECO', c: { gstin: 0, name: 1, no: 2, type: 3, date: 4, val: 5, pos: 6, taxable: 7, rep: [8, 9, 10, 11], p1: 12, fd: 13, p2b: 14, itc: 15, act: [16, 17, 18, 19], reason: 20 } },\n    'ECOA': { kind: 'amend', fam: 'ECO', c: { oNo: 0, oDate: 1, gstin: 2, name: 3, no: 4, type: 5, date: 6, val: 7, pos: 8, taxable: 9, rep: [10, 11, 12, 13], p1: 19, fd: 20, p2b: 21, itc: 22, act: [23, 24, 25, 26], reason: 27 } },\n  };\n  const ORDER = ['B2B', 'B2BA', 'B2B-CDNR', 'B2B-CDNRA', 'ECO', 'ECOA'];\n  const DISPLAY_NAME = { 'B2B': 'B2B', 'B2BA': 'B2BA', 'B2B-CDNR': 'B2B-CDNR', 'B2B-CDNRA': 'B2B-CDNRA', 'ECO': 'ECO', 'ECOA': 'ECOA' };\n  const ALIASES = { 'B2B': 'B2B', 'B2BA': 'B2BA', 'B2BCDNR': 'B2B-CDNR', 'CDNR': 'B2B-CDNR', 'B2BCDNRA': 'B2B-CDNRA', 'CDNRA': 'B2B-CDNRA', 'ECO': 'ECO', 'ECOA': 'ECOA' };\n\n  /* ---------- helpers ---------- */\n  const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;\n  const sum = (a) => r2(a.reduce((s, x) => s + x, 0));\n  const EPS = 0.005;\n\n  function cellText(v) {\n    if (v === null || v === undefined) return '';\n    if (v instanceof Date) return v;\n    if (typeof v === 'object') {\n      if (v.richText) return v.richText.map((t) => t.text).join('');\n      if (v.result !== undefined) return cellText(v.result);\n      if (v.text !== undefined) return cellText(v.text);\n      if (v.error) return '';\n      return '';\n    }\n    return v;\n  }\n  const str = (v) => (v === null || v === undefined ? '' : String(v).trim());\n  function toNum(v) {\n    if (typeof v === 'number') return isFinite(v) ? v : 0;\n    if (typeof v === 'string') {\n      const t = v.replace(/[,₹\\s]/g, '');\n      if (t === '' || t === '-') return 0;\n      const n = parseFloat(t);\n      return isFinite(n) ? n : 0;\n    }\n    return 0;\n  }\n  const pad = (n) => String(n).padStart(2, '0');\n  function parseDate(v) {\n    // returns { s: 'dd/mm/yyyy', d: Date(UTC) } or { s: original text, d: null }\n    if (v instanceof Date && !isNaN(v)) {\n      const d = new Date(Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate()));\n      return { s: pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(), d };\n    }\n    if (typeof v === 'number' && v > 20000 && v \u003c 80000) {\n      const d = new Date(Math.round((v - 25569) * 86400000));\n      return parseDate(d);\n    }\n    const t = str(v);\n    const m = t.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{4})$/);\n    if (m) {\n      const d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));\n      return { s: pad(+m[1]) + '/' + pad(+m[2]) + '/' + m[3], d };\n    }\n    return { s: t, d: null };\n  }\n  const normNo = (s) => str(s).toUpperCase();\n  const isCredit = (t) => /^(cn|crn|cr|c|credit.*)$/i.test(str(t));\n  const isDebit = (t) => /^(dn|drn|dr|d|debit.*)$/i.test(str(t));\n  const normType = (t) => (isCredit(t) ? 'CN' : isDebit(t) ? 'DN' : str(t).toUpperCase());\n\n  /* ---------- reading an ExcelJS workbook into arrays ---------- */\n  function readWorkbook(wb) {\n    const out = { sheets: {}, meta: {}, found: [], missing: [], ignored: [] };\n    wb.eachSheet((ws) => {\n      const key = ALIASES[ws.name.toUpperCase().replace(/[^A-Z0-9]/g, '')];\n      const isReadMe = /^read\\s*me$/i.test(ws.name.trim());\n      if (!key && !isReadMe) { out.ignored.push(ws.name); return; }\n      const cols = ws.columnCount || 30;\n      const rows = [];\n      ws.eachRow({ includeEmpty: true }, (row, rn) => {\n        const arr = [];\n        for (let c = 1; c \u003c= cols; c++) arr.push(cellText(row.getCell(c).value));\n        rows[rn - 1] = arr;\n      });\n      for (let i = 0; i \u003c rows.length; i++) if (!rows[i]) rows[i] = [];\n      if (isReadMe) {\n        const find = (re) => {\n          for (const r of rows) for (let c = 0; c \u003c r.length; c++) {\n            if (re.test(str(r[c]))) { for (let k = c + 1; k \u003c r.length; k++) if (str(r[k]) !== '' && !re.test(str(r[k]))) return str(r[k]); }\n          }\n          return '';\n        };\n        out.meta = { fy: find(/^financial year$/i), gstin: find(/^gstin$/i), legal: find(/^legal name$/i), trade: find(/^trade name/i), generated: find(/^date of generation$/i) };\n        return;\n      }\n      out.sheets[key] = { name: ws.name, rows };\n    });\n    ORDER.forEach((k) => (out.sheets[k] ? out.found.push(k) : out.missing.push(k)));\n    return out;\n  }\n\n  /* ---------- parse one sheet into records ---------- */\n  function validateLayout(rows, L) {\n    const warns = [];\n    const head = rows.slice(0, 8);\n    const colText = (c) => head.map((r) => str(r[c])).join(' | ');\n    if (!/itc\\s*avail/i.test(colText(L.c.itc))) warns.push('ITC availability column not found where expected');\n    if (L.c.act && !L.c.act.every((c) => /actual\\s*itc/i.test(colText(c)))) warns.push('\"Actual ITC amount considered\" columns not found where expected');\n    if (!/tax\\s*amount/i.test(colText(L.c.rep[0]))) warns.push('\"Tax amount\" columns not found where expected');\n    return warns;\n  }\n\n  // Older files (e.g. FY 2024-25) have no \"Actual ITC amount considered\" block, so every column after it shifts left\n  function resolveLayout(key, rows) {\n    const L0 = LAYOUTS[key];\n    const hasAct = rows.slice(0, 8).some((r) => r.some((x) => /actual\\s*itc/i.test(str(x))));\n    if (hasAct) return { L: L0, hasAct: true };\n    return { L: { kind: L0.kind, fam: L0.fam, c: Object.assign({}, L0.c, { act: null, reason: L0.c.itc + 1 }) }, hasAct: false };\n  }\n\n  function parseSheet(key, sheet, warnings, info) {\n    const rows = sheet.rows;\n    const rl = resolveLayout(key, rows);\n    const L = rl.L, c = L.c;\n    const vw = validateLayout(rows, L);\n    vw.forEach((w) => warnings.push(`${key}: ${w} – check the sheet layout.`));\n    let start = -1;\n    for (let i = 0; i \u003c Math.min(rows.length, 15); i++) {\n      if (rows[i].some((x) => /^integrated/i.test(str(x)))) { start = i + 1; break; }\n    }\n    if (start \u003c 0) { warnings.push(`${key}: could not find the header rows; sheet skipped.`); return []; }\n    const recs = [];\n    for (let i = start; i \u003c rows.length; i++) {\n      const r = rows[i];\n      if (!r || !r.length) continue;\n      const no = str(r[c.no]), gstin = str(r[c.gstin]);\n      if (no === '' && gstin === '') continue;\n      if (/^total/i.test(gstin) || /^total/i.test(no)) continue;\n      let type = str(r[c.type]);\n      const credit = L.fam !== 'INV' && isCredit(type);\n      const sg = credit ? -1 : 1;\n      const dt = parseDate(r[c.date]);\n      const rec = {\n        src: key, kind: L.kind, fam: L.fam, rowNo: i + 1,\n        gstin, name: str(r[c.name]), no, type: L.fam === 'CDN' ? normType(type) : type,\n        category: L.fam === 'INV' ? 'Invoice' : L.fam === 'CDN' ? (credit ? 'Credit Note' : isDebit(type) ? 'Debit Note' : 'Note') : (credit ? 'Credit Note' : 'ECO Document'),\n        credit, date: dt.s, dateObj: dt.d, pos: str(r[c.pos]),\n        val: r2(sg * toNum(r[c.val])), taxable: r2(sg * toNum(r[c.taxable])),\n        rep: c.rep.map((x) => r2(sg * toNum(r[x]))),\n        act: c.act ? c.act.map((x) => r2(sg * toNum(r[x]))) : c.rep.map((x) => r2(sg * toNum(r[x]))),\n        rcm: c.rcm !== undefined ? str(r[c.rcm]) : '',\n        itcAvail: str(r[c.itc]), p1: str(r[c.p1]), p2b: str(r[c.p2b]),\n        fd: parseDate(r[c.fd]), reason: str(r[c.reason]),\n        alive: true,\n      };\n      // tax heads used for ITC: actual-ITC columns in original sheets; revised tax-amount columns in amendment sheets\n      rec.itc = L.kind === 'orig' ? rec.act : rec.rep;\n      const availNo = /^n/i.test(rec.itcAvail);\n      const rcmYes = /^y/i.test(rec.rcm);\n      rec.exclBasis = [];\n      if (availNo) rec.exclBasis.push('ITC Availability = No');\n      if (rcmYes) rec.exclBasis.push('Reverse Charge = Yes');\n      rec.excluded = rec.exclBasis.length > 0;\n      if (L.kind === 'amend') {\n        rec.oNo = str(r[c.oNo]);\n        const od = parseDate(r[c.oDate]);\n        rec.oDate = od.s; rec.oDateObj = od.d;\n        rec.oType = c.oType !== undefined ? normType(r[c.oType]) : rec.type;\n      }\n      recs.push(rec);\n    }\n    if (!rl.hasAct && recs.length && info) info.old.push(key);\n    return recs;\n  }\n\n  /* ---------- amendment logic ---------- */\n  const keyOf = (fam, type, no, date) => (fam === 'CDN' ? normType(type) + '|' : '') + normNo(no) + '|' + date;\n\n  function consolidate(parsed) {\n    const warnings = [...(parsed.warnings || [])];\n    const all = [];\n    const index = new Map();\n    const add = (rec) => {\n      all.push(rec);\n      const k = keyOf(rec.fam, rec.type, rec.no, rec.date);\n      if (!index.has(k)) index.set(k, []);\n      index.get(k).push(rec);\n    };\n    const recsBySheet = {};\n    const info = { old: [] };\n    ORDER.forEach((k) => { if (parsed.sheets[k]) recsBySheet[k] = parseSheet(k, parsed.sheets[k], warnings, info); });\n    const notes = [];\n    if (info.old.length) notes.push('Older-format file (no \"Actual ITC amount considered\" columns) in sheet(s): ' + info.old.join(', ') + '. ITC tax heads are taken from the reported Tax amount columns for these sheets; entries with ITC Availability = No or Reverse Charge = Yes are still excluded.');\n    ORDER.filter((k) => LAYOUTS[k].kind === 'orig').forEach((k) => (recsBySheet[k] || []).forEach(add));\n\n    const superseded = [];\n    ORDER.filter((k) => LAYOUTS[k].kind === 'amend').forEach((k) => {\n      (recsBySheet[k] || []).forEach((rec) => {\n        const ek = keyOf(rec.fam, rec.oType, rec.oNo, rec.oDate);\n        const cands = (index.get(ek) || []).filter((x) => x.alive && x.fam === rec.fam);\n        let m = null, note = '';\n        if (cands.length) {\n          m = cands.find((x) => normNo(x.gstin) === normNo(rec.gstin)) || cands[0];\n          if (cands.length > 1) note = 'Multiple originals matched on number/date – picked the one with same GSTIN (or first)';\n        }\n        if (m) {\n          m.alive = false; m.supersededBy = rec;\n          rec.prev = m;\n          rec.base = m.kind === 'amend' && m.base ? m.base : m;\n          superseded.push(m);\n          compare(rec);\n          if (note) rec.changes = [rec.changes, note].filter((x) => x && x !== '—').join('; ');\n        } else {\n          rec.base = null;\n          rec.remark = 'Newly added in amended data';\n          rec.changes = 'Original (' + (rec.oType && rec.fam === 'CDN' ? rec.oType + ' ' : '') + rec.oNo + ' / ' + rec.oDate + ') not found in original sheet';\n          rec.diff = null;\n        }\n        add(rec);\n      });\n    });\n\n    const live = all.filter((x) => x.alive);\n    const consolidated = live.filter((x) => !x.excluded);\n    const excluded = live.filter((x) => x.excluded);\n    return { consolidated, excluded, superseded, all, warnings, notes, basisOld: info.old, meta: parsed.meta || {}, found: parsed.found, missing: parsed.missing, ignored: parsed.ignored };\n  }\n\n  function compare(rec) {\n    const o = rec.base;\n    const dTax = r2(sum(rec.rep) - sum(o.rep));\n    rec.diff = {\n      val: r2(rec.val - o.val), taxable: r2(rec.taxable - o.taxable),\n      heads: rec.rep.map((x, i) => r2(x - o.rep[i])), tax: dTax,\n    };\n    // direction judged on magnitude of the document (so a bigger credit note = increase)\n    const mv = r2(Math.abs(rec.val) - Math.abs(o.val));\n    const mt = r2(Math.abs(sum(rec.rep)) - Math.abs(sum(o.rep)));\n    const mx = r2(Math.abs(rec.taxable) - Math.abs(o.taxable));\n    const dir = Math.abs(mv) > EPS ? mv : Math.abs(mt) > EPS ? mt : Math.abs(mx) > EPS ? mx : 0;\n    rec.remark = dir > 0 ? 'Amended – value increased' : dir \u003c 0 ? 'Amended – value decreased' : 'Amended – no change in value';\n    const ch = [];\n    const eligibilityChecks = [];\n    if (normNo(rec.no) !== normNo(o.no)) ch.push('Doc no. (' + o.no + ' → ' + rec.no + ')');\n    if (rec.date !== o.date) ch.push('Doc date (' + o.date + ' → ' + rec.date + ')');\n    if (normNo(rec.gstin) !== normNo(o.gstin)) ch.push('GSTIN (' + o.gstin + ' → ' + rec.gstin + ')');\n    if (rec.fam === 'CDN' && rec.type !== o.type) ch.push('Note type (' + o.type + ' → ' + rec.type + ')');\n    if (/^n/i.test(rec.itcAvail) !== /^n/i.test(o.itcAvail)) {\n      const change = 'ITC availability (' + (o.itcAvail || 'Blank') + ' → ' + (rec.itcAvail || 'Blank') + ')';\n      ch.push(change);\n      eligibilityChecks.push(change);\n    }\n    if (/^y/i.test(rec.rcm) !== /^y/i.test(o.rcm)) {\n      const change = 'Reverse charge (' + (o.rcm || 'Blank') + ' → ' + (rec.rcm || 'Blank') + ')';\n      ch.push(change);\n      eligibilityChecks.push(change);\n    }\n    rec.eligibilityChecks = eligibilityChecks;\n    rec.eligibilityMove = o.excluded === rec.excluded ? null : {\n      from: o.excluded ? 'Excluded' : 'Consolidated',\n      to: rec.excluded ? 'Excluded' : 'Consolidated',\n    };\n    rec.changes = ch.length ? ch.join('; ') : '—';\n  }\n\n\n  /* ---------- reconciliation with the portal's Table 8A(A) figures ---------- */\n  const HEADS = ['Integrated Tax', 'Central Tax', 'State/UT Tax', 'Cess'];\n  const cents = (x) => Math.round(x * 100);\n  const TREAT = {\n    C: (e) => (e.rec.credit ? 'Credit note deducted in Excel – portal may not have deducted it' : 'Counted in Excel – portal may not have it'),\n    E: () => 'Excluded in Excel (ITC No / RCM) – portal may have counted it',\n    S: () => 'Original replaced by amendment – portal may count both',\n  };\n\n  function reconcile(res, portal) {\n    const excel = totals(res.consolidated, (x) => x.itc).h;\n    const rows = HEADS.map((h, i) => {\n      const diff = r2(excel[i] - portal[i]);\n      const a = Math.abs(diff);\n      return { head: h, excel: excel[i], portal: portal[i], diff, status: a \u003c 0.005 ? 'Matched' : a \u003c 1 ? 'Rounding-level difference' : 'Difference' };\n    });\n    const entries = [];\n    res.consolidated.forEach((x) => entries.push({ rec: x, cat: 'C', vec: x.itc.map((v) => -v) }));\n    res.excluded.forEach((x) => entries.push({ rec: x, cat: 'E', vec: x.rep.slice() }));\n    res.superseded.forEach((x) => entries.push({ rec: x, cat: 'S', vec: x.act.slice() }));\n    entries.forEach((e, i) => { e.id = i; e.treat = TREAT[e.cat](e); });\n\n    const found = new Map();           // key (entry ids) -> finding\n    const searched = [];\n    rows.forEach((row, h) => {\n      if (row.status === 'Matched') return;\n      const T = cents(portal[h] - excel[h]);       // effect needed on the Excel total\n      const tol = 1;                                // ±1 paisa\n      const near = (v) => Math.abs(v - T) \u003c= tol;\n      const ev = entries.map((e) => cents(e.vec[h]));\n      const nz = entries.filter((e, i) => ev[i] !== 0);\n      const hits = [];\n      const add = (level, label, list) => {\n        const key = list.map((e) => e.id).sort((a, b) => a - b).join(',');\n        let f = found.get(key);\n        if (!f) { f = { level, label, entries: list, heads: [], key }; found.set(key, f); }\n        if (!f.heads.includes(h)) f.heads.push(h);\n        hits.push( h]); return Math.sign(v) === sg && Math.abs(v) \u003c= Math.abs(T); }).slice(0, 3000);\n        const m = new Map();\n        pool.forEach((e) => { const v = cents(e.vec[h]); if (!m.has(v)) m.set(v, []); m.get(v).push(e); });\n        let cnt = 0;\n        for (let i = 0; i \u003c pool.length && cnt \u003c 400; i++) {\n          const vi = cents(pool[i].vec[h]);\n          for (let j = i + 1; j \u003c pool.length && cnt \u003c 400; j++) {\n            const need = T - vi - cents(pool[j].vec[h]);\n            if (Math.abs(need) > Math.abs(T) || Math.sign(need) !== sg) continue;\n            for (const d of [need - 1, need, need + 1]) (m.get(d) || []).forEach((c3) => { if (c3.id > pool[j].id) { add('Three entries', 'Three entries together equal the difference (low confidence)', [pool[i], pool[j], c3]); cnt++; } });\n          }\n        }\n      }\n      searched.push({ head: h, hits: hits.length, level: hits.length ? hits[0].level : 'none' });\n    });\n    const findings = [...found.values()].map((f) => {\n      f.sum = [0, 1, 2, 3].map((k) => r2(f.entries.reduce((s, e) => s + e.vec[k], 0)));\n      return f;\n    });\n    // rank: level order, then shared supplier/period, then size\n    const lv = { 'Single entry': 0, Group: 1, Pair: 2, 'Three entries': 3 };\n    const coh = (f) => (new Set(f.entries.map((e) => e.rec.gstin)).size === 1 ? 0 : 1) + (new Set(f.entries.map((e) => e.rec.p2b)).size === 1 ? 0 : 1);\n    findings.sort((a, b) => lv[a.level] - lv[b.level] || coh(a) - coh(b) || a.entries.length - b.entries.length);\n    const capped = findings.filter((f) => f.level !== 'Three entries').concat(findings.filter((f) => f.level === 'Three entries').slice(0, 8));\n    return { rows, findings: capped, totalFindings: findings.length, searched, hasDiff: rows.some((r) => r.status !== 'Matched') };\n  }\n\n  /* ---------- summaries ---------- */\n  function totals(list, field) {\n    const t = { n: list.length, taxable: 0, h: [0, 0, 0, 0], total: 0 };\n    list.forEach( h: 'Cess (₹)', w: 12, g: 'tax', f: (x) => (isExcl ? x.rep : x.itc)[3], t: 'num', sum: true },\n      { h: isExcl ? 'Total Tax – not part of ITC (₹)' : 'Total ITC (₹)', w: 17, g: 'tax', rowSum: [12, 15], t: 'num', sum: true },\n      { h: 'GSTR-1/IFF Period', w: 12, g: 'ret', f: (x) => x.p1 },\n      { h: 'GSTR-1/IFF Filing Date', w: 14, g: 'ret', f: (x) => x.fd.d || x.fd.s, t: 'date' },\n      { h: 'GSTR-2B Period', w: 12, g: 'ret', f: (x) => x.p2b },\n      { h: 'ITC Availability', w: 11, g: 'ret', f: (x) => x.itcAvail },\n      { h: 'Reverse Charge', w: 10, g: 'ret', f: (x) => x.rcm },\n    ];\n    if (isExcl) {\n      cols.push({ h: 'Exclusion Basis', w: 30, g: 'exc', f: (x) => x.exclBasis.join(' + ') });\n      cols.push({ h: 'Reason (as per file)', w: 24, g: 'exc', f: (x) => x.reason });\n    }\n    cols.push(\n      { h: 'Amendment Remark', w: 30, g: 'amd', f: (x) => x.remark || (x.kind === 'amend' ? '' : 'As per original data') },\n      { h: 'Details Changed in Amendment', w: 44, g: 'amd', f: (x) => (x.kind === 'amend' ? x.changes || '' : '') },\n      { h: 'Original Doc No.', w: 20, g: 'org', f: (x) => (x.base ? x.base.no : '') },\n      { h: 'Original Doc Date', w: 13, g: 'org', f: (x) => (x.base ? x.base.dateObj || x.base.date : ''), t: 'date' },\n      { h: 'Original Doc Value (₹)', w: 16, g: 'org', f: (x) => (x.base ? x.base.val : ''), t: 'num', sum: true },\n      { h: 'Original Taxable Value (₹)', w: 16, g: 'org', f: (x) => (x.base ? x.base.taxable : ''), t: 'num', sum: true },\n      { h: 'Original Total Tax (₹)', w: 16, g: 'org', f: (x) => (x.base ? sum(x.base.rep) : ''), t: 'num', sum: true },\n      { h: 'Diff – Doc Value (₹)', w: 15, g: 'dif', f: (x) => (x.diff ? x.diff.val : ''), t: 'num', sum: true },\n      { h: 'Diff – Taxable Value (₹)', w: 15, g: 'dif', f: (x) => (x.diff ? x.diff.taxable : ''), t: 'num', sum: true },\n      { h: 'Diff – Integrated Tax (₹)', w: 15, g: 'dif', f: (x) => (x.diff ? x.diff.heads[0] : ''), t: 'num', sum: true },\n e(/\\.xlsx?m?$/i,'')+'_8A_Consolidated.xlsx';\n      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);\n    }catch(e){alert('Could not create the Excel file: '+e.message)}\n    b.disabled=false;b.textContent='Download Excel';\n  };\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="doc-reco">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>GSTR-2B and 8A Reconciliation\u003c/title>\n\u003c!--GSTLIBS:exceljs-->\n\u003cstyle>\n:root{font-family:Inter,\"Segoe UI\",Arial,sans-serif;color:#182230;background:#f4f6f9;font-size:14px}\n*{box-sizing:border-box}\nbody{margin:0;padding:24px;overflow:auto}\n.wrap{max-width:1300px;margin:0 auto}\n.eyebrow{color:#1d6b52;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}\nh1{margin:5px 0 6px;font-size:26px;letter-spacing:-.03em;color:#14251f}\n.lede{margin:0 0 18px;color:#617064;line-height:1.55;max-width:820px}\n.notice{padding:13px 16px;border:1px solid #dce6df;border-radius:12px;background:#fff;color:#4c5c50;line-height:1.5;margin-bottom:14px}\n.notice strong{color:#182230}\n.notice.ok{background:#e9f6ee;border-color:#bfe0cb;color:#1d5b3a}\n.notice.wait{background:#fff8e6;border-color:#f0e0b0;color:#6b5314}\n.panel{background:#fff;border:1px solid #e2e8e4;border-radius:14px;box-shadow:0 8px 26px #16332708;padding:16px 18px;margin-bottom:14px}\n.panel h2{margin:0 0 10px;font-size:15px;color:#14251f}\n.scope{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}\n.scope label{display:flex;gap:9px;align-items:flex-start;font-weight:600;color:#253a30;cursor:pointer;max-width:560px;line-height:1.4}\n.scope input{margin-top:3px;width:16px;height:16px;accent-color:#1d6b52}\n.scope .meta{color:#617064;font-size:13px;line-height:1.55}\n.cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:12px;margin:0 0 14px}\n.card{padding:14px 16px;background:#fff;border:1px solid #e2e8e4;border-radius:12px}\n.card span{display:block;color:#657267;font-size:12px}\n.card b{display:block;margin-top:5px;font-size:22px;font-variant-numeric:tabular-nums}\n.card.ok b{color:#1d6b52}.card.warn b{color:#a35b08}.card.bad b{color:#b33a30}.card.info b{color:#5b3f8c}\n.table-wrap{overflow:auto;border:1px solid #e2e8e4;border-radius:12px;background:#fff;margin-bottom:14px}\ntable{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}\nth,td{padding:10px 12px;border-bottom:1px solid #edf0ee;text-align:left}\nth{background:#f4f7f5;color:#506056;font-size:11px;text-transform:uppercase;letter-spacing:.04em}\ntd.num,th.num{text-align:right;font-variant-numeric:tabular-nums}\ntr.diff td{font-weight:800;background:#f0f7f3}\ntr.diff td.bad{color:#b33a30}\ntr.res td{color:#657267;font-style:italic}\nh3{margin:18px 2px 8px;font-size:15px;color:#14251f}\n.hint{margin:6px 2px 14px;color:#68766d;font-size:12px;line-height:1.5}\n.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0;padding:14px 16px;background:#fff;border:1px solid #e2e8e4;border-radius:12px}\n.toolbar span{flex:1;min-width:220px;color:#617064;font-size:13px}\nbutton{min-height:38px;padding:8px 18px;border:0;border-radius:8px;background:#1d6b52;color:#fff;font:inherit;font-weight:700;cursor:pointer}\nbutton:hover:not(:disabled){background:#15543f}\nbutton:disabled{opacity:.45;cursor:not-allowed}\n.empty{padding:30px;text-align:center;color:#617064;background:#fff;border:1px solid #e2e8e4;border-radius:12px}\n.error{color:#a83229}\n@media(max-width:820px){body{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"eyebrow\">Third step\u003c/div>\n  \u003ch1>GSTR-2B &harr; Table 8A Reconciliation\u003c/h1>\n  \u003cp class=\"lede\">Compares the consolidated GSTR-2B (&ldquo;All ITC&rdquo;) with the consolidated Table 8A entries, document by document. First consolidate the monthly 2B files in the \u003cb>2B\u003c/b> tab, then the 8A file in the \u003cb>8A\u003c/b> tab.\u003c/p>\n  \u003cdiv id=\"message\" class=\"notice wait\" role=\"status\">Waiting for consolidated data from the 2B and 8A tabs.\u003c/div>\n  \u003cdiv id=\"body\" hidden>\n    \u003cdiv class=\"panel scope\">\n      \u003clabel>\u003cinput type=\"checkbox\" id=\"scope\" checked>\u003cspan>Compare only the GSTR-2B periods loaded in the 2B tab \u003cspan style=\"font-weight:400;color:#617064\">(recommended &ndash; Table 8A covers the whole year, so months that are not loaded would show up as false &ldquo;8A only&rdquo; differences)\u003c/span>\u003c/span>\u003c/label>\n      \u003cdiv class=\"meta\" id=\"scopeInfo\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"cards\" id=\"cards\">\u003c/div>\n    \u003ch3>Totals compared\u003c/h3>\n    \u003cdiv class=\"table-wrap\">\u003ctable id=\"totals\">\u003c/table>\u003c/div>\n    \u003ch3>What makes up the difference\u003c/h3>\n    \u003cdiv class=\"table-wrap\">\u003ctable id=\"bridge\">\u003c/table>\u003c/div>\n    \u003cdiv class=\"hint\" id=\"hint\">\u003c/div>\n    \u003cdiv class=\"toolbar\">\u003cspan>The Excel file has a Summary, an Exceptions sheet (documents that need attention, plus the 8A entries whose 2B month is not loaded) and the full Reconciliation sheet.\u003c/span>\u003cbutton id=\"download\" type=\"button\" disabled>Download Excel\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>/* GSTR-2B  \u003c->  GSTR-9 Table 8A reconciliation core (browser global GSTReco / Node module) */\n(function (root) {\n  'use strict';\n  var HEADS = ['Document Value', 'Taxable Value', 'Integrated Tax', 'Central Tax', 'State/UT Tax', 'Cess'];\n  var TOL = 0.01;\n\n  var r2 = function (n) { return Math.round((n + Number.EPSILON) * 100) / 100; };\n  var norm = function (v) { return String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, ''); };\n  function amount(v) {\n    if (typeof v === 'number') return isFinite(v) ? v : 0;\n    var t = String(v == null ? '' : v).replace(/[₹,\\s]/g, '');\n    if (/^\\(.*\\)$/.test(t)) t = '-' + t.slice(1, -1);\n    var n = parseFloat(t); return isFinite(n) ? n : 0;\n  }\n  function pad(n) { return String(n).padStart(2, '0'); }\n  /* -> { key:'YYYY-MM-DD', d:Date(UTC) } ; key '' when unreadable */\n  function parseDate(v) {\n    if (v instanceof Date && !isNaN(v)) { var u = new Date(Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate())); return { key: u.getUTCFullYear() + '-' + pad(u.getUTCMonth() + 1) + '-' + pad(u.getUTCDate()), d: u }; }\n    if (typeof v === 'number' && v > 20000 && v \u003c 80000) return parseDate(new Date(Math.round((v - 25569) * 86400000)));\n    var t = String(v == null ? '' : v).trim(); if (!t) return { key: '', d: null };\n    var m = t.match(/^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{2,4})$/);\n    if (m) { var y = +m[3]; if (y \u003c 100) y += 2000; return parseDate(new Date(Date.UTC(y, +m[2] - 1, +m[1]))); }\n    m = t.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n    if (m) return parseDate(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])));\n    return { key: '', d: null };\n  }\n  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];\n  /* 'Apr-2025' / \"Apr'25\" / 'APR-25' / 'April' -> 'APR-25' (key used on both sides) */\n  function periodKey(v) {\n    var t = String(v == null ? '' : v).trim().toUpperCase();\n    var m = t.match(/([A-Z]{3})[A-Z]*[\\s\\-'’\\/]*(\\d{2,4})/);\n    if (!m || MON.indexOf(m[1]) \u003c 0) return '';\n    return m[1] + '-' + m[2].slice(-2);\n  }\n  function fyRange(fy) {\n    var m = String(fy || '').match(/(\\d{4})/); if (!m) return null;\n    var y = +m[1]; return { start: Date.UTC(y, 3, 1), end: Date.UTC(y + 1, 2, 31) };\n  }\n  function vecDiff(a, b) { return a.map(function (v, i) { return r2(v - b[i]); }); }\n  var zero = function () { return [0, 0, 0, 0, 0, 0]; };\n  function addTo(acc, v) { for (var i = 0; i \u003c 6; i++) acc[i] = r2(acc[i] + v[i]); return acc; }\n\n  function compute(sources, opts) {\n    opts = opts || {};\n    var s2 = sources && sources['2b'], s8 = sources && sources['8a'];\n    if (!s2 || !s8) return { ready: false, missing: [!s8 ? '8A' : null, !s2 ? '2B' : null].filter(Boolean) };\n    var meta = s8.meta || {};\n    var gstin8 = norm(meta.gstin);\n    var fy = fyRange(meta.fy);\n    var scopeOn = opts.scope !== false;\n    var notes = [];\n\n    /* ---------- 2B side ---------- */\n    var excl = { isd: { n: 0, t: zero() }, impg: { n: 0, t: zero() }, rcm: { n: 0, t: zero() } };\n    var otherGstin = 0, skipped2 = 0, b = [], periods = {};\n    (s2.rows || []).forEach(function (c) {\n      if (!Array.isArray(c) || c.length \u003c 15) { skipped2++; return; }\n      if (gstin8 && norm(c[2]) !== gstin8) { otherGstin++; return; }\n      var type = String(c[14] == null ? '' : c[14]).trim().toUpperCase(), compact = type.replace(/[^A-Z0-9]/g, '');\n      var vals = [amount(c[8]), amount(c[9]), amount(c[10]), amount(c[11]), amount(c[12]), amount(c[13])];\n      var kind = /REVERSE\\s*CHARGE/.test(type) ? 'rcm' : /^IMPG/.test(compact) || type.indexOf('IMPORT OF GOODS') >= 0 ? 'impg' : /^ISD/.test(compact) || type.indexOf('ISD') >= 0 ? 'isd' : '';\n      if (kind) { excl[kind].n++; addTo(excl[kind].t, vals); return; }\n      if (!norm(c[4]) || !norm(c[6])) { skipped2++; return; }\n      var dt = parseDate(c[7]), pk = periodKey(c[1]);\n      if (pk) periods[pk] = (periods[pk] || 0) + 1;\n      b.push({ gstin: String(c[4]), name: String(c[5] == null ? '' : c[5]), no: String(c[6]), date: dt.d, dateKey: dt.key, dateText: String(c[7] == null ? '' : c[7]), type: String(c[14] == null ? '' : c[14]), period: pk || String(c[1] || ''), vals: vals, key: norm(c[4]) + '|' + norm(c[6]), used: false });\n    });\n\n    /* ---------- 8A side ---------- */\n    var loaded = Object.keys(periods);\n    var a = [], out8 = { n: 0, t: zero(), rows: [] }, skipped8 = 0, all8 = 0;\n    (s8.rows || []).forEach(function (c) {\n      if (!Array.isArray(c) || c.length \u003c 19) { skipped8++; return; }\n      if (!norm(c[3]) || !norm(c[5])) { skipped8++; return; }\n      all8++;\n      var vals = [amount(c[9]), amount(c[10]), amount(c[11]), amount(c[12]), amount(c[13]), amount(c[14])];\n      var pk = periodKey(c[18]);\n      var dt = parseDate(c[7]);\n      var rec = { gstin: String(c[3]), name: String(c[4] == null ? '' : c[4]), no: String(c[5]), date: dt.d, dateKey: dt.key, dateText: String(c[7] == null ? '' : c[7]), src: String(c[1] || ''), p2b: pk || String(c[18] || ''), vals: vals, key: norm(c[3]) + '|' + norm(c[5]), used: false };\n      if (scopeOn && loaded.length && loaded.indexOf(pk) \u003c 0) {\n        out8.n++; addTo(out8.t, vals);\n        out8.rows.push({ status: '8A - 2B period not loaded', remark: 'Table 8A entry with GSTR-2B period ' + rec.p2b + ' - that month is not loaded in the 2B tab, so it was not compared', gstin: rec.gstin, name: rec.name, a: rec, b: null, diffs: vals.slice() });\n        return;\n      }\n      a.push(rec);\n    });\n\n    var pOrd = function (k) { var m = String(k).match(/^([A-Z]{3})-(\\d{2})$/); return m ? (+m[2]) * 12 + MON.indexOf(m[1]) : 9999; };\n    out8.rows.sort(function (p, q) { return pOrd(p.a.p2b) - pOrd(q.a.p2b) || String(p.gstin).localeCompare(String(q.gstin)) || String(p.a.no).localeCompare(String(q.a.no)); });\n\n    /* ---------- matching ---------- */\n    var index = new Map();\n    a.forEach(function (y) { if (!index.has(y.key)) index.set(y.key, []); index.get(y.key).push(y); });\n    var out = [];\n    function same(x, y) { return y.vals.every(function (v, i) { return Math.abs(v - x.vals[i]) \u003c= TOL; }); }\n    var left2 = [];\n    b.forEach(function (x) {\n      var cands = (index.get(x.key) || []).filter(function (y) { return !y.used; });\n      var y = cands.filter(function (z) { return z.dateKey && z.dateKey === x.dateKey; })[0] || cands[0];\n      if (!y) { left2.push(x); return; }\n      y.used = true; x.used = true; out.push({ a: y, b: x });\n    });\n    /* pass 2: same supplier + same date + same amounts, only the document number is typed differently */\n    var left8 = a.filter(function (y) { return !y.used; });\n    left2 = left2.filter(function (x) {\n      var y = left8.filter(function (z) { return !z.used && norm(z.gstin) === norm(x.gstin) && z.dateKey && z.dateKey === x.dateKey && same(x, z); })[0];\n      if (!y) return true;\n      y.used = true; x.used = true; out.push({ a: y, b: x, numDiff: true }); return false;\n    });\n    left2.forEach(function (x) { out.push({ a: null, b: x }); });\n    a.forEach(function (y) { if (!y.used) out.push({ a: y, b: null }); });\n\n    var rows = out.map(function (r) {\n      var A = r.a, B = r.b, st, remark = '', diffs;\n      diffs = vecDiff(A ? A.vals : zero(), B ? B.vals : zero());\n      if (A && B) {\n        var why = [];\n        var dateDiff = !!(A.dateKey && B.dateKey && A.dateKey !== B.dateKey);\n        if (dateDiff) why.push('Document date');\n        diffs.forEach(function (d, i) { if (Math.abs(d) > TOL) why.push(HEADS[i]); });\n        if (r.numDiff) { remark = 'Document number differs (8A: ' + A.no + ' / 2B: ' + B.no + '). '; }\n        if (why.length) { st = 'Difference'; remark += 'Differs in: ' + why.join(', '); } else { st = 'Matched'; }\n      } else if (A) { st = '8A only'; remark = 'In Table 8A (period ' + A.p2b + ') but not in the loaded 2B data'; }\n      else {\n        var outFy = fy && B.date && (B.date.getTime() \u003c fy.start || B.date.getTime() > fy.end);\n        if (outFy) { st = '2B only (other FY)'; remark = 'Invoice dated outside FY ' + meta.fy + ' - belongs to another year\\'s Table 8A'; }\n        else { st = '2B only'; remark = 'In GSTR-2B (' + B.period + ') but not in Table 8A'; }\n      }\n      return { status: st, remark: remark.trim(), gstin: (A || B).gstin, name: (A || B).name || (B && B.name) || '', a: A, b: B, diffs: diffs };\n    });\n    var rank = { 'Difference': 0, '2B only': 1, '8A only': 2, '2B only (other FY)': 3, 'Matched': 4 };\n    rows.sort(function (p, q) { return rank[p.status] - rank[q.status] || String(p.gstin).localeCompare(String(q.gstin)) || String(p.a ? p.a.no : p.b.no).localeCompare(String(q.a ? q.a.no : q.b.no)); });\n\n    /* ---------- totals and bridge ---------- */\n    var aTot = zero(), bTot = zero(), br = { a8: zero(), b2: zero(), bfy: zero(), mm: zero() };\n    var counts = { 'Matched': 0, 'Difference': 0, '2B only': 0, '8A only': 0, '2B only (other FY)': 0 };\n    rows.forEach(function (r) {\n      counts[r.status]++;\n      if (r.a) addTo(aTot, r.a.vals); if (r.b) addTo(bTot, r.b.vals);\n      if (r.status === '8A only') addTo(br.a8, r.diffs);\n      else if (r.status === '2B only') addTo(br.b2, r.diffs);\n      else if (r.status === '2B only (other FY)') addTo(br.bfy, r.diffs);\n      else addTo(br.mm, r.diffs);\n    });\n    var diffTot = vecDiff(aTot, bTot), bridgeTot = zero();\n    [br.a8, br.b2, br.bfy, br.mm].forEach(function (v) { addTo(bridgeTot, v); });\n    var residual = vecDiff(diffTot, bridgeTot);\n\n    if (!loaded.length) notes.push('No 2B tax period could be read, so the 8A entries could not be limited to the loaded periods.');\n    return {\n      ready: true, meta: meta, scopeOn: scopeOn, fy: meta.fy || '',\n      periods: loaded.sort().map(function (k) { return { key: k, n: periods[k] }; }),\n      all8: all8, in8: a.length, out8: out8, excl: excl, otherGstin: otherGstin, skipped: skipped2 + skipped8,\n      rows: rows, counts: counts, aTot: aTot, bTot: bTot, diffTot: diffTot,\n      bridge: [\n        { label: '8A entries not in 2B (8A only)', v: br.a8 },\n        { label: '2B entries not in 8A (2B only, invoice within FY)', v: br.b2 },\n        { label: '2B entries not in 8A (invoice dated outside the FY)', v: br.bfy },\n        { label: 'Amount differences on matched documents', v: br.mm },\n      ],\n      bridgeTot: bridgeTot, residual: residual, notes: notes,\n    };\n  }\n\n  /* ---------- Excel output (ExcelJS) ---------- */\n  var NUM = '#,##0.00;[Red]-#,##0.00;0.00';\n  var FILL = function (c) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: c } }; };\n  var BORDER = {
